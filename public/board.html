<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LiveBoard - Editor</title>
  <style>
    :root { --bg:#0f0f13; --surface:#1a1a24; --surface2:#22222e; --border:#2d2d40; --accent:#7c5cff; --text:#e8e8f0; --muted:#6b6b80; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#1e1e2a; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); user-select:none; touch-action:none; }

    /* ── Toolbar principal ── */
    #toolbar { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px 10px; box-shadow:0 8px 32px rgba(0,0,0,.5); max-width:calc(100vw - 24px); overflow-x:auto; scrollbar-width:none; }
    #toolbar::-webkit-scrollbar { display:none; }
    .tb-sep { width:1px; height:28px; background:var(--border); margin:0 4px; flex-shrink:0; }
    .tb-btn { display:flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all .15s; position:relative; flex-shrink:0; }
    .tb-btn:hover { background:var(--surface2); color:var(--text); }
    .tb-btn.active { background:rgba(124,92,255,.2); color:var(--accent); }
    .tb-tip { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#111; color:#eee; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .15s; z-index:100; }
    @media (hover:hover) { .tb-btn:hover .tb-tip { opacity:1; } }

    /* ── Painel de opções ── */
    #opts { position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:999; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 12px; box-shadow:0 4px 16px rgba(0,0,0,.4); max-width:calc(100vw - 24px); overflow-x:auto; scrollbar-width:none; }
    #opts::-webkit-scrollbar { display:none; }
    #opts.hidden { display:none; }
    .swatch { width:28px; height:28px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:transform .1s; flex-shrink:0; }
    .swatch:hover { transform:scale(1.15); }
    .swatch.sel { border-color:white; }
    input[type="range"] { width:70px; height:4px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
    input[type="color"] { width:28px; height:28px; border:1px solid var(--border); border-radius:6px; cursor:pointer; padding:1px; background:var(--surface2); flex-shrink:0; }
    .ol { font-size:11px; color:var(--muted); white-space:nowrap; }

    /* ── Painel contextual (objeto selecionado) ── */
    #ctx { position:fixed; top:70px; right:8px; z-index:1000; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; width:180px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    #ctx h4 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:10px; }
    .cr { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:7px; }
    .cl { font-size:12px; color:var(--muted); }
    .ci { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text); width:68px; outline:none; }
    .ci:focus { border-color:var(--accent); }
    .cb { width:100%; padding:8px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; cursor:pointer; margin-top:4px; }
    .cb:hover, .cb:active { background:var(--border); }
    .cb.d:hover, .cb.d:active { background:rgba(255,80,80,.15); color:#ff6060; border-color:rgba(255,80,80,.3); }

    /* ── Status bar ── */
    #users { position:fixed; bottom:14px; left:14px; z-index:1000; display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:12px; }
    .udot { width:8px; height:8px; border-radius:50%; }
    #status { position:fixed; bottom:14px; right:14px; z-index:1000; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .sdot { width:6px; height:6px; border-radius:50%; background:#444; }
    .sdot.on { background:#4ade80; }
    .sdot.blink { background:#fbbf24; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Zoom info ── */
    #zoom-info { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:1000; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:11px; color:var(--muted); pointer-events:none; }

    /* ── Cursores remotos ── */
    .rcursor { position:fixed; pointer-events:none; z-index:9000; }
    .rcname { position:absolute; left:16px; top:0; font-size:11px; padding:2px 6px; border-radius:4px; white-space:nowrap; color:#000; }

    /* ── Toast ── */
    #toast { position:fixed; bottom:60px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 18px; font-size:13px; color:var(--muted); display:none; z-index:2000; gap:10px; align-items:center; }
    #toast.show { display:flex; }
    .spinner { width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ══════════════════════════════════════════
       PAINEL DE CAMADAS
    ══════════════════════════════════════════ */
    #layers-panel {
      position:fixed; right:8px; top:50%; transform:translateY(-50%);
      z-index:1000; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:0; width:240px;
      box-shadow:0 8px 32px rgba(0,0,0,.5);
      display:flex; flex-direction:column;
      max-height:calc(100vh - 160px);
      transition: transform .2s, opacity .2s;
    }
    #layers-panel.collapsed { transform:translateY(-50%) translateX(232px); }
    #layers-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 10px; border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    #layers-header span { font-size:12px; font-weight:600; color:var(--text); letter-spacing:.4px; text-transform:uppercase; cursor:pointer; flex:1; }
    #layers-toggle { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:4px; display:flex; align-items:center; }
    #layers-toggle:hover { color:var(--text); background:var(--surface2); }

    /* Toolbar do painel */
    #layers-toolbar {
      display:flex; gap:3px; padding:6px 8px; border-bottom:1px solid var(--border);
      flex-shrink:0; flex-wrap:wrap;
    }
    .lt-btn {
      display:flex; align-items:center; gap:4px; padding:4px 7px;
      border:1px solid var(--border); border-radius:6px; background:var(--surface2);
      color:var(--muted); font-size:10px; cursor:pointer; white-space:nowrap;
      transition: all .15s;
    }
    .lt-btn:hover { background:var(--border); color:var(--text); }
    .lt-btn:disabled { opacity:.35; cursor:not-allowed; }
    .lt-btn.accent { background:rgba(124,92,255,.2); border-color:var(--accent); color:var(--accent); }
    .lt-btn.danger { background:rgba(255,80,80,.1); border-color:rgba(255,80,80,.3); color:#ff6060; }

    #layers-list {
      overflow-y:auto; overflow-x:hidden; flex:1;
      scrollbar-width:thin; scrollbar-color:var(--border) transparent;
    }
    #layers-list::-webkit-scrollbar { width:4px; }
    #layers-list::-webkit-scrollbar-track { background:transparent; }
    #layers-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .layer-item {
      display:flex; align-items:center; gap:6px;
      padding:6px 8px; cursor:pointer;
      border-bottom:1px solid rgba(255,255,255,.03);
      transition:background .1s; position:relative;
      min-height:34px;
    }
    .layer-item:hover { background:var(--surface2); }
    .layer-item.selected { background:rgba(124,92,255,.15); }
    .layer-item.panel-selected { outline:2px solid rgba(124,92,255,.5); outline-offset:-2px; }
    .layer-item.drag-over { border-top:2px solid var(--accent); }
    .layer-item.is-group { background:rgba(124,92,255,.05); }
    .layer-item.is-group-child { padding-left:22px; background:rgba(0,0,0,.1); }

    /* Checkbox de seleção de painel */
    .layer-check {
      width:14px; height:14px; flex-shrink:0; border-radius:3px;
      border:1.5px solid var(--border); background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .1s;
    }
    .layer-check.checked { background:var(--accent); border-color:var(--accent); }
    .layer-check.checked::after { content:'✓'; font-size:9px; color:#fff; line-height:1; }

    .layer-drag-handle {
      color:var(--muted); cursor:grab; flex-shrink:0; opacity:.4;
      font-size:13px; line-height:1; padding:0 1px; user-select:none;
    }
    .layer-drag-handle:active { cursor:grabbing; }
    .layer-icon { width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .layer-expand-btn {
      width:14px; height:14px; flex-shrink:0; border:none; background:none;
      color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
      padding:0; transition:transform .15s;
    }
    .layer-expand-btn.open { transform:rotate(90deg); }

    /* Nome editável */
    .layer-name {
      flex:1; font-size:11px; color:var(--text);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      min-width:0;
    }
    .layer-name-input {
      flex:1; font-size:11px; color:var(--text); min-width:0;
      background:var(--surface); border:1px solid var(--accent);
      border-radius:4px; padding:1px 5px; outline:none;
    }

    .layer-actions { display:flex; gap:2px; flex-shrink:0; }
    .layer-action-btn {
      width:20px; height:20px; border:none; background:none; color:var(--muted);
      cursor:pointer; border-radius:4px; display:flex; align-items:center; justify-content:center;
      opacity:.6; padding:0;
    }
    .layer-action-btn:hover { background:var(--surface); color:var(--text); opacity:1; }
    .layer-action-btn.hidden-obj { color:#555; }
    #layers-empty { padding:20px; text-align:center; font-size:11px; color:var(--muted); }

    /* ══════════════════════════════════════════
       PAINEL DO VIEWPORT
    ══════════════════════════════════════════ */
    #vp-panel {
      position:fixed; left:8px; top:50%; transform:translateY(-50%);
      z-index:1000; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:0; width:190px;
      box-shadow:0 8px 32px rgba(0,0,0,.5);
      display:flex; flex-direction:column;
      transition: transform .2s, opacity .2s;
    }
    #vp-panel.collapsed { transform:translateY(-50%) translateX(-182px); }
    #vp-header { 
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 12px;
      flex-shrink:0; cursor:pointer; 
    }
    #vp-content {
      padding: 12px; display:flex; flex-direction:column; gap:6px;
    }
    #vp-header span { font-size:12px; font-weight:600; color:var(--text); letter-spacing:.4px; text-transform:uppercase; }
    #vp-toggle { background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; border-radius:4px; display:flex; align-items:center; }
    #vp-toggle:hover { color:var(--text); background:var(--surface2); }
    .vp-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:8px; }
    .vp-label { font-size:11px; color:var(--muted); }
    .vp-input { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:11px; color:var(--text); width:80px; outline:none; }
    .vp-input:focus { border-color:var(--accent); }
    .vp-btn { width:100%; padding:8px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; cursor:pointer; margin-top:4px; text-align:center; }
    .vp-btn:hover { background:var(--border); }
    .vp-btn.accent { background:rgba(124,92,255,.3); border-color:var(--accent); color:var(--accent); }
    .vp-btn.accent:hover { background:rgba(124,92,255,.5); }
    .vp-sep { height:1px; background:var(--border); margin:8px 0; }
    #vp-coords { font-size:10px; color:var(--muted); text-align:center; margin-top:6px; }

    /* Cursor pan */
    body.panning { cursor:grabbing !important; }
    body.pan-mode canvas { cursor:grab !important; }
    body.pan-mode.panning canvas { cursor:grabbing !important; }
  </style>
</head>
<body>

<!-- ═══════════ TOOLBAR ═══════════ -->
<div id="toolbar">
  <button class="tb-btn active" id="t-select" onclick="setTool('select')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-tip">Selecionar (V)</span></button>
  <button class="tb-btn" id="t-pan" onclick="setTool('pan')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 00-2-2 2 2 0 00-2 2" stroke-linecap="round"/><path d="M14 10V4a2 2 0 00-2-2 2 2 0 00-2 2v2" stroke-linecap="round"/><path d="M10 10.5V6a2 2 0 00-2-2 2 2 0 00-2 2v8" stroke-linecap="round"/><path d="M6 14a6 6 0 009.33 5l2.17-3.5" stroke-linecap="round"/></svg><span class="tb-tip">Mover (H / Espaço)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="t-pen" onclick="setTool('pen')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg><span class="tb-tip">Caneta (P)</span></button>
  <button class="tb-btn" id="t-eraser" onclick="setTool('eraser')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l10-10 7 7-3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-tip">Borracha (E)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="t-rect" onclick="setTool('rect')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span class="tb-tip">Retângulo (R)</span></button>
  <button class="tb-btn" id="t-circle" onclick="setTool('circle')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span class="tb-tip">Elipse (C)</span></button>
  <button class="tb-btn" id="t-line" onclick="setTool('line')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5" stroke-linecap="round"/></svg><span class="tb-tip">Linha (L)</span></button>
  <button class="tb-btn" id="t-arrow" onclick="setTool('arrow')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg><span class="tb-tip">Seta (A)</span></button>
  <button class="tb-btn" id="t-text" onclick="setTool('text')"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span class="tb-tip">Texto (T)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="document.getElementById('img-inp').click()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span class="tb-tip">Imagem</span></button>
  <input type="file" id="img-inp" accept="image/*" style="display:none" onchange="insertImg(this)">
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="undo()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg><span class="tb-tip">Desfazer (Ctrl+Z)</span></button>
  <button class="tb-btn" onclick="redo()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 014-4h12"/></svg><span class="tb-tip">Refazer (Ctrl+Y)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="fitViewport()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-tip">Centralizar View (F)</span></button>
  <button class="tb-btn" onclick="resetZoom()"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg><span class="tb-tip">Zoom 100% (0)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="clearAll()" style="color:#ff6060"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg><span class="tb-tip">Limpar</span></button>
</div>

<!-- ═══════════ OPÇÕES DE FERRAMENTA ═══════════ -->
<div id="opts" class="hidden">
  <span class="ol">Cor:</span>
  <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
    <div class="swatch sel" style="background:#fff" onclick="setColor('#fff',this)"></div>
    <div class="swatch" style="background:#ff4444" onclick="setColor('#ff4444',this)"></div>
    <div class="swatch" style="background:#ff9900" onclick="setColor('#ff9900',this)"></div>
    <div class="swatch" style="background:#ffdd00" onclick="setColor('#ffdd00',this)"></div>
    <div class="swatch" style="background:#44ff44" onclick="setColor('#44ff44',this)"></div>
    <div class="swatch" style="background:#44aaff" onclick="setColor('#44aaff',this)"></div>
    <div class="swatch" style="background:#cc44ff" onclick="setColor('#cc44ff',this)"></div>
    <div class="swatch" style="background:#000;border-color:#555" onclick="setColor('#000',this)"></div>
    <input type="color" value="#ffffff" onchange="setColor(this.value,null)">
  </div>
  <div class="tb-sep" style="height:24px;flex-shrink:0"></div>
  <span class="ol">Esp:</span><input type="range" id="sz" min="1" max="60" value="4" oninput="setSz(this.value)"><span class="ol" id="szv">4</span>
  <div class="tb-sep" style="height:24px;flex-shrink:0"></div>
  <span class="ol">Opa:</span><input type="range" id="op" min="10" max="100" value="100" oninput="setOp(this.value)"><span class="ol" id="opv">100%</span>
  <div class="tb-sep" style="height:24px;flex-shrink:0"></div>
  <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;flex-shrink:0"><input type="checkbox" id="fill" onchange="fillShape=this.checked">Preen.</label>
</div>

<!-- ═══════════ PAINEL CONTEXTUAL ═══════════ -->
<div id="ctx">
  <h4>Objeto</h4>
  <div class="cr"><span class="cl">Largura</span><input type="number" class="ci" id="cw" min="1" oninput="resizeSel('w',this.value)"></div>
  <div class="cr"><span class="cl">Altura</span><input type="number" class="ci" id="ch" min="1" oninput="resizeSel('h',this.value)"></div>
  <div class="cr"><span class="cl">Opacidade</span><input type="number" class="ci" id="cop" min="0" max="100" oninput="setSelOp(this.value)"></div>
  <button class="cb" onclick="sendBackFront('back')">⬇ Para trás</button>
  <button class="cb" onclick="sendBackFront('front')">⬆ Para frente</button>
  <button class="cb d" onclick="delSel()">Excluir</button>
</div>

<!-- ═══════════ PAINEL DE VIEWPORT ═══════════ -->
<div id="vp-panel">
  <div id="vp-header" onclick="toggleVpPanel()">
    <span>📺 Viewport</span>
    <button id="vp-toggle" title="Recolher">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div id="vp-content">
    <div class="vp-row">
      <span class="vp-label">Largura</span>
      <input type="number" class="vp-input" id="vp-w" value="1920" onchange="updateViewport()">
    </div>
    <div class="vp-row">
      <span class="vp-label">Altura</span>
      <input type="number" class="vp-input" id="vp-h" value="1080" onchange="updateViewport()">
    </div>
    <div class="vp-sep"></div>
    <button class="vp-btn accent" onclick="fitViewport()">⊙ Ir para Viewport</button>
    <div id="vp-coords">1920 × 1080 px</div>
  </div>
</div>

<!-- ═══════════ PAINEL DE CAMADAS ═══════════ -->
<div id="layers-panel">
  <div id="layers-header">
    <span onclick="toggleLayersPanel()">⬆ Camadas</span>
    <button id="layers-toggle" title="Recolher" onclick="toggleLayersPanel()">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div id="layers-toolbar">
    <button class="lt-btn accent" id="lt-group" onclick="groupSelected()" title="Agrupar objetos selecionados no painel" disabled>
      <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="8" height="8" rx="1"/><rect x="14" y="8" width="8" height="8" rx="1"/><rect x="8" y="2" width="8" height="8" rx="1"/></svg>
      Agrupar
    </button>
    <button class="lt-btn" id="lt-ungroup" onclick="ungroupSelected()" title="Desagrupar grupo selecionado" disabled>
      <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18" stroke-linecap="round"/></svg>
      Desagrupar
    </button>
  </div>
  <div id="layers-list">
    <div id="layers-empty">Nenhum objeto no board</div>
  </div>
</div>

<!-- ═══════════ STATUS ═══════════ -->
<div id="toast"><div class="spinner"></div><span id="toast-msg">Enviando imagem...</span></div>
<div id="users"><div class="udot" id="mydot" style="background:#7c5cff"></div><span id="ucnt">Conectando...</span></div>
<div id="status"><div class="sdot blink" id="sdot"></div><span id="stxt">Conectando...</span></div>
<div id="zoom-info">100%</div>

<canvas id="board"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = new fabric.Canvas('board', {
  width: window.innerWidth, height: window.innerHeight,
  selection: true, renderOnAddRemove: false,
  enableRetinaScaling: true, backgroundColor: '#1e1e2a',
  allowTouchScrolling: false,
});
window.addEventListener('resize', () => {
  canvas.setWidth(window.innerWidth);
  canvas.setHeight(window.innerHeight);
  canvas.renderAll();
  drawViewportRect();
});

// ═══════════════════════════════════════════════════════════════════════════════
// ESTADO GERAL
// ═══════════════════════════════════════════════════════════════════════════════
let tool = 'select', color = '#ffffff', sz = 4, op = 1, fillShape = false;
let myId = null;
let isDrawing = false, drawStart = null, tmpShapeId = null;
let penActive = false;
const undoStack = [], redoStack = [], MAX_H = 50;
const remoteStrokes = {}, remoteCursors = {};

// ═══════════════════════════════════════════════════════════════════════════════
// ── FUNCIONALIDADE 1: PAN / NAVEGAÇÃO ──────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
let isPanMode   = false;   // ferramenta pan ativa
let isPanning   = false;   // está arrastando agora
let panLastX    = 0, panLastY = 0;
let spaceHeld   = false;   // espaço pressionado = pan temporário
let prevTool    = 'select';

// Dois dedos mobile
let touchLastDist = null, touchLastMidX = null, touchLastMidY = null;
let isTwoFinger = false;

function enterPanMode() {
  isPanMode = true;
  canvas.isDrawingMode = false;
  canvas.selection = false;
  canvas.defaultCursor = 'grab';
  canvas.hoverCursor  = 'grab';
  document.body.classList.add('pan-mode');
}
function exitPanMode() {
  isPanMode = false;
  canvas.hoverCursor = 'move';
  document.body.classList.remove('pan-mode');
  document.body.classList.remove('panning');
}

// Scroll (trackpad / roda do mouse) → pan + zoom
canvas.wrapperEl.addEventListener('wheel', e => {
  e.preventDefault();
  const zoom  = canvas.getZoom();
  const point = new fabric.Point(e.offsetX, e.offsetY);

  if (e.ctrlKey || e.metaKey) {
    // Pinch-to-zoom do trackpad (ctrlKey) ou Ctrl+scroll
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newZoom = Math.max(0.05, Math.min(8, zoom * delta));
    canvas.zoomToPoint(point, newZoom);
  } else {
    // Pan com dois dedos no trackpad ou roda do mouse
    const vpt = canvas.viewportTransform;
    vpt[4] -= e.deltaX;
    vpt[5] -= e.deltaY;
    canvas.setViewportTransform(vpt);
  }
  canvas.renderAll();
  updateZoomInfo();
  drawViewportRect();
  updateVpCoords();
}, { passive: false });

// Mouse: clique do meio = pan; pan mode = arrastar com btn esquerdo
const canvasEl = canvas.upperCanvasEl;

canvasEl.addEventListener('mousedown', e => {
  const isMiddle = e.button === 1;
  const isLeft   = e.button === 0;
  if (isMiddle || (isPanMode && isLeft) || (spaceHeld && isLeft)) {
    e.preventDefault();
    isPanning = true;
    panLastX  = e.clientX;
    panLastY  = e.clientY;
    document.body.classList.add('panning');
  }
}, { passive: false });

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const dx = e.clientX - panLastX;
  const dy = e.clientY - panLastY;
  panLastX = e.clientX; panLastY = e.clientY;
  const vpt = canvas.viewportTransform;
  vpt[4] += dx; vpt[5] += dy;
  canvas.setViewportTransform(vpt);
  canvas.renderAll();
  drawViewportRect();
  updateVpCoords();
});

window.addEventListener('mouseup', e => {
  if (isPanning) {
    isPanning = false;
    document.body.classList.remove('panning');
  }
});

// Touch: dois dedos = pan + zoom
canvasEl.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isTwoFinger = true;
    touchLastDist = null;
    touchLastMidX = null; touchLastMidY = null;
    e.preventDefault();
    return;
  }
  isTwoFinger = false;

  // Um dedo em pan mode
  if (isPanMode && e.touches.length === 1) {
    isPanning = true;
    panLastX = e.touches[0].clientX;
    panLastY = e.touches[0].clientY;
    e.preventDefault();
    return;
  }

  // Fallback para lógica normal (ferramenta de desenho)
  if (tool === 'pen' && !spaceHeld) {
    penActive = true;
    const p = getCanvasPoint(e);
    socket.emit('draw:start', { x: p.x, y: p.y, color, width: sz, opacity: op });
    return;
  }
  e.preventDefault();
  if (e.touches.length !== 1) return;
  const p = getCanvasPoint(e);
  socket.volatile.emit('cursor:move', { x: p.clientX, y: p.clientY });
  const target = canvas.findTarget(e.touches[0]);
  if (canvas.getActiveObjects().length > 0 && tool !== 'eraser') return;
  if (target && ['rect','circle','line','arrow'].includes(tool)) return;
  handlePointerDown({ x: p.x, y: p.y }, target);
}, { passive: false });

canvasEl.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const midX = (t0.clientX + t1.clientX) / 2;
    const midY = (t0.clientY + t1.clientY) / 2;

    if (touchLastDist !== null) {
      const scaleFactor = dist / touchLastDist;
      const zoom  = canvas.getZoom();
      const newZoom = Math.max(0.05, Math.min(8, zoom * scaleFactor));
      const point = new fabric.Point(midX, midY);
      canvas.zoomToPoint(point, newZoom);

      const dx = midX - touchLastMidX;
      const dy = midY - touchLastMidY;
      const vpt = canvas.viewportTransform;
      vpt[4] += dx; vpt[5] += dy;
      canvas.setViewportTransform(vpt);
      canvas.renderAll();
      updateZoomInfo();
      drawViewportRect();
    }
    touchLastDist = dist;
    touchLastMidX = midX; touchLastMidY = midY;
    return;
  }

  if (isPanMode && isPanning && e.touches.length === 1) {
    e.preventDefault();
    const dx = e.touches[0].clientX - panLastX;
    const dy = e.touches[0].clientY - panLastY;
    panLastX = e.touches[0].clientX; panLastY = e.touches[0].clientY;
    const vpt = canvas.viewportTransform;
    vpt[4] += dx; vpt[5] += dy;
    canvas.setViewportTransform(vpt);
    canvas.renderAll();
    drawViewportRect();
    updateVpCoords();
    return;
  }

  if (tool === 'pen') {
    const p = getCanvasPoint(e);
    socket.volatile.emit('draw:move', { x: p.x, y: p.y });
    return;
  }
  e.preventDefault();
  if (!isDrawing || !drawStart) return;
  const p = getCanvasPoint(e);
  socket.volatile.emit('cursor:move', { x: p.clientX, y: p.clientY });
  updateTmpShape({ x: p.x, y: p.y });
}, { passive: false });

canvasEl.addEventListener('touchend', e => {
  if (isTwoFinger) { isTwoFinger = false; touchLastDist = null; e.preventDefault(); return; }
  if (isPanMode && isPanning) { isPanning = false; e.preventDefault(); return; }
  if (tool === 'pen') { penActive = false; return; }
  e.preventDefault();
  const p = getCanvasPoint(e);
  handlePointerUp({ x: p.x, y: p.y });
}, { passive: false });

function resetZoom() {
  canvas.setViewportTransform([1,0,0,1,0,0]);
  canvas.renderAll();
  updateZoomInfo();
  drawViewportRect();
  updateVpCoords();
}

function updateZoomInfo() {
  const pct = Math.round(canvas.getZoom() * 100);
  document.getElementById('zoom-info').textContent = pct + '%';
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── FUNCIONALIDADE 2: VIEWPORT 1920×1080 ───────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════
// O retângulo de viewport é um objeto especial no canvas (não sincronizado)
// que representa a área que o /view enxerga.
// O servidor recebe a posição do viewport e repassa para o view.html.

let vpRect = null;          // fabric.Rect do viewport (não faz parte do board)
// Viewport é SEMPRE fixo em (0, 0) — a view sempre olha para essa origem.
const vpX = 0, vpY = 0;
let vpW = 1920, vpH = 1080;
let isDraggingVp = false; // mantido para compatibilidade, nunca será true

function createViewportRect() {
  if (vpRect) { canvas.remove(vpRect); }
  vpRect = new fabric.Rect({
    left: 0, top: 0,
    width: vpW, height: vpH,
    fill: 'transparent',
    stroke: '#7c5cff',
    strokeWidth: 2,
    strokeDashArray: [12, 6],
    selectable: false,
    evented: false,        // nunca intercepta cliques/toques
    hasControls: false,
    hasBorders: false,
    _isViewportRect: true,
  });
  canvas.add(vpRect);
  canvas.bringToFront(vpRect);
  drawViewportRect();
}

function drawViewportRect() {
  if (!vpRect) return;
  vpRect.set({ left: 0, top: 0, width: vpW, height: vpH });
  vpRect.setCoords();
  canvas.bringToFront(vpRect);
  document.getElementById('vp-w').value = Math.round(vpW);
  document.getElementById('vp-h').value = Math.round(vpH);
  canvas.renderAll();
}

canvas.on('mouse:move', opt => {
  const p = canvas.getPointer(opt.e);
  socket.volatile.emit('cursor:move', { x: opt.e.clientX, y: opt.e.clientY });

  if (penActive && tool === 'pen') {
    socket.volatile.emit('draw:move', { x: p.x, y: p.y });
  }
  if (!isDrawing || !drawStart) return;
  updateTmpShape(p);
});

canvas.on('mouse:up', opt => {
  if (tool === 'pen') { penActive = false; return; }
  handlePointerUp(canvas.getPointer(opt.e));
});

canvas.on('mouse:down', opt => {
  if (opt.target && opt.target._isViewportRect) return; // nunca seleciona o viewport
  if (isPanMode || spaceHeld) return; // pan mode handled separately
  if (opt.e.button !== 0) return;
  if (canvas.getActiveObjects().length > 0 && tool !== 'eraser') return;
  if (opt.target && ['rect','circle','line','arrow'].includes(tool)) return;
  handlePointerDown(canvas.getPointer(opt.e), opt.target);
});

function updateViewport() {
  vpW = parseInt(document.getElementById('vp-w').value) || 1920;
  vpH = parseInt(document.getElementById('vp-h').value) || 1080;
  drawViewportRect();
  emitViewportSync();
}

function fitViewport() {
  // Centraliza a câmera exatamente no retângulo do viewport (sempre em 0,0)
  const zoom = Math.min(
    (window.innerWidth * 0.85) / vpW,
    (window.innerHeight * 0.85) / vpH
  );
  const newZoom = Math.max(0.05, Math.min(8, zoom));
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const vptX = cx - (vpW / 2) * newZoom;
  const vptY = cy - (vpH / 2) * newZoom;
  canvas.setViewportTransform([newZoom,0,0,newZoom, vptX, vptY]);
  canvas.renderAll();
  updateZoomInfo();
  drawViewportRect();
  updateVpCoords();
}

function updateVpCoords() {
  document.getElementById('vp-coords').textContent = `${vpW} × ${vpH} px`;
}

function emitViewportSync() {
  socket.emit('viewport:sync', { x: 0, y: 0, w: vpW, h: vpH });
}

function toggleVpPanel() {
  document.getElementById('vp-panel').classList.toggle('collapsed');
}
function toggleLayersPanel() {
  document.getElementById('layers-panel').classList.toggle('collapsed');
}

// ═══════════════════════════════════════════════════════════════════════════════
// ── PAINEL DE CAMADAS ──────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════

let layersUpdateTimer = null;
const hiddenObjects   = new Set();   // IDs ocultos localmente
const panelSelected   = new Set();   // IDs selecionados NO PAINEL (multi-check)
const objectNames     = {};          // id → nome customizado
const collapsedGroups = new Set();   // IDs de grupos recolhidos
const typeCounters    = {};          // tipo → contador para nomes auto

function scheduleLayersUpdate() {
  clearTimeout(layersUpdateTimer);
  layersUpdateTimer = setTimeout(updateLayersPanel, 80);
}

// ── Nome fixo por objeto (não muda com a ordem) ───────────────────────────────
function assignDefaultName(obj) {
  if (objectNames[obj.id]) return;
  const typeKey = {
    'path':'Traço','rect':'Retângulo','ellipse':'Elipse','circle':'Elipse',
    'line':'Linha','group':'Grupo','i-text':'Texto','text':'Texto','image':'Imagem',
  }[obj.type] || 'Objeto';
  typeCounters[typeKey] = (typeCounters[typeKey] || 0) + 1;
  objectNames[obj.id] = `${typeKey} ${typeCounters[typeKey]}`;
}

function getDisplayName(obj) {
  if (obj.type === 'i-text' || obj.type === 'text') {
    const t = (obj.text || '').trim().slice(0, 18);
    return objectNames[obj.id] || (t ? `"${t}"` : 'Texto');
  }
  return objectNames[obj.id] || obj.type;
}

// ── Ícones ────────────────────────────────────────────────────────────────────
function getLayerIcon(type) {
  const icons = {
    'path':   `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 17c3-3 5-7 9-7s6 4 9 7" stroke-linecap="round"/></svg>`,
    'rect':   `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>`,
    'ellipse':`<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="7"/></svg>`,
    'circle': `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
    'line':   `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5" stroke-linecap="round"/></svg>`,
    'group':  `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="8" height="8" rx="1"/><rect x="14" y="8" width="8" height="8" rx="1"/><rect x="8" y="2" width="8" height="8" rx="1"/></svg>`,
    'i-text': `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>`,
    'text':   `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>`,
    'image':  `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  };
  return icons[type] || icons['rect'];
}

// ── Rename inline (duplo clique) ──────────────────────────────────────────────
function startRename(id, nameEl) {
  const current = nameEl.textContent;
  const input = document.createElement('input');
  input.className = 'layer-name-input';
  input.value = current;
  nameEl.replaceWith(input);
  input.focus(); input.select();
  function commit() {
    const val = input.value.trim() || current;
    objectNames[id] = val;
    scheduleLayersUpdate();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = current; input.blur(); }
    e.stopPropagation();
  });
}

// ── Toolbar: habilita/desabilita botões ───────────────────────────────────────
function updateLayerToolbar() {
  const btnGroup   = document.getElementById('lt-group');
  const btnUngroup = document.getElementById('lt-ungroup');
  if (!btnGroup) return;
  btnGroup.disabled = panelSelected.size < 2;
  const selObjs = [...panelSelected].map(id => findById(id)).filter(Boolean);
  const panelHasGroup = selObjs.length === 1 && selObjs[0].type === 'group';
  const activeIsGroup = canvas.getActiveObject()?.type === 'group';
  btnUngroup.disabled = !(panelHasGroup || (panelSelected.size === 0 && activeIsGroup));
}

// ── Agrupar (via painel ou seleção do canvas) ─────────────────────────────────
function groupSelected() {
  let targets = [...panelSelected].map(id => findById(id)).filter(o => o && !o._isViewportRect);
  if (targets.length < 2) targets = canvas.getActiveObjects().filter(o => !o._isViewportRect);
  if (targets.length < 2) return;
  pushH();
  const oldIds = targets.map(o => o.id).filter(Boolean);
  canvas.discardActiveObject();
  const sel = new fabric.ActiveSelection(targets, { canvas });
  canvas.setActiveObject(sel);
  const group = sel.toGroup();
  group.id = genId();
  typeCounters['Grupo'] = (typeCounters['Grupo'] || 0) + 1;
  objectNames[group.id] = `Grupo ${typeCounters['Grupo']}`;
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.discardActiveObject();
  canvas.setActiveObject(group);
  canvas.renderAll();
  panelSelected.clear();
  emitFull(group);
  socket.emit('object:remove', oldIds);
  scheduleLayersUpdate();
}

// ── Desagrupar ────────────────────────────────────────────────────────────────
function ungroupSelected() {
  let groupObj = null;
  const selObjs = [...panelSelected].map(id => findById(id)).filter(Boolean);
  if (selObjs.length === 1 && selObjs[0].type === 'group') groupObj = selObjs[0];
  else groupObj = canvas.getActiveObject();
  if (!groupObj || groupObj.type !== 'group') return;
  pushH();
  const groupId = groupObj.id;
  const children = groupObj.getObjects ? [...groupObj.getObjects()] : [];
  canvas.discardActiveObject();
  canvas.setActiveObject(groupObj);
  groupObj.toActiveSelection();
  children.forEach(ch => {
    if (!ch.id) ch.id = genId();
    assignDefaultName(ch);
    emitFull(ch);
  });
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.renderAll();
  socket.emit('object:remove', [groupId]);
  panelSelected.clear();
  scheduleLayersUpdate();
}

// ── Recolher/expandir grupo no painel ────────────────────────────────────────
function toggleGroupCollapse(id, e) {
  if (e) e.stopPropagation();
  if (collapsedGroups.has(id)) collapsedGroups.delete(id);
  else collapsedGroups.add(id);
  scheduleLayersUpdate();
}

// ── Drag & drop para reordenar ───────────────────────────────────────────────
let layerDragSrcId = null;

// ── Render principal do painel ───────────────────────────────────────────────
function updateLayersPanel() {
  const list = document.getElementById('layers-list');
  const allObjs = canvas.getObjects().filter(o => o.id && !o._isViewportRect);
  allObjs.forEach(o => assignDefaultName(o));

  if (!allObjs.length) {
    list.innerHTML = '<div id="layers-empty">Nenhum objeto no board</div>';
    updateLayerToolbar(); return;
  }

  const canvasSel = new Set(canvas.getActiveObjects().map(o => o.id));
  list.innerHTML = '';

  [...allObjs].reverse().forEach(obj => {
    const isGroup    = obj.type === 'group';
    const collapsed  = collapsedGroups.has(obj.id);
    const isPanSel   = panelSelected.has(obj.id);
    const isCanSel   = canvasSel.has(obj.id);
    const isHidden   = hiddenObjects.has(obj.id);
    const accent     = obj.stroke || (obj.fill && obj.fill !== 'transparent' ? obj.fill : null) || '#7c5cff';

    const item = document.createElement('div');
    item.className = ['layer-item', isCanSel ? 'selected' : '', isPanSel ? 'panel-selected' : '', isGroup ? 'is-group' : ''].filter(Boolean).join(' ');
    item.dataset.id = obj.id;
    item.draggable = true;

    const expandHtml = isGroup
      ? `<button class="layer-expand-btn ${collapsed ? '' : 'open'}" onclick="toggleGroupCollapse('${obj.id}',event)"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`
      : `<span style="display:inline-block;width:14px;flex-shrink:0"></span>`;

    const eyeHtml = isHidden
      ? `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;

    item.innerHTML = `
      <div class="layer-check ${isPanSel ? 'checked' : ''}" data-check="${obj.id}"></div>
      <div class="layer-drag-handle">⋮⋮</div>
      ${expandHtml}
      <div class="layer-icon" style="color:${accent}">${getLayerIcon(obj.type)}</div>
      <span class="layer-name" data-rename="${obj.id}" title="Duplo clique para renomear">${getDisplayName(obj)}</span>
      <div class="layer-actions">
        <button class="layer-action-btn ${isHidden ? 'hidden-obj' : ''}" onclick="toggleObjVisibility('${obj.id}')">${eyeHtml}</button>
        <button class="layer-action-btn" onclick="deleteObjById('${obj.id}')" style="color:#ff6060">
          <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </div>`;

    // Checkbox painel
    item.querySelector('[data-check]').addEventListener('click', e => {
      e.stopPropagation();
      panelSelected.has(obj.id) ? panelSelected.delete(obj.id) : panelSelected.add(obj.id);
      scheduleLayersUpdate();
    });

    // Duplo clique → renomear
    item.querySelector('[data-rename]').addEventListener('dblclick', e => {
      e.stopPropagation();
      startRename(obj.id, e.currentTarget);
    });

    // Clique simples → selecionar no canvas
    item.addEventListener('click', e => {
      if (e.target.closest('.layer-action-btn,.layer-drag-handle,[data-check],.layer-expand-btn,[data-rename]')) return;
      canvas.setActiveObject(obj); canvas.renderAll(); scheduleLayersUpdate();
    });

    // Drag reorder
    item.addEventListener('dragstart', e => { layerDragSrcId = obj.id; item.style.opacity = '.5'; e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend',   () => { item.style.opacity = ''; list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); });
    item.addEventListener('dragover',  e => { e.preventDefault(); list.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); item.classList.add('drag-over'); });
    item.addEventListener('drop', e => {
      e.preventDefault(); item.classList.remove('drag-over');
      if (!layerDragSrcId || layerDragSrcId === obj.id) return;
      const src = findById(layerDragSrcId); if (!src) return;
      canvas.moveTo(src, allObjs.indexOf(obj));
      canvas.renderAll();
      socket.emit('zorder:sync', canvas.getObjects().map(o => o.id).filter(Boolean));
      scheduleLayersUpdate(); layerDragSrcId = null;
    });

    list.appendChild(item);

    // Filhos do grupo (expandido)
    if (isGroup && !collapsed) {
      const children = obj.getObjects ? obj.getObjects() : [];
      [...children].reverse().forEach(ch => {
        if (!ch.id) ch.id = genId();
        assignDefaultName(ch);
        const ci = document.createElement('div');
        ci.className = 'layer-item is-group-child';
        ci.innerHTML = `
          <span style="width:14px;flex-shrink:0"></span>
          <span style="width:14px;flex-shrink:0"></span>
          <span style="width:14px;flex-shrink:0;border-left:2px solid var(--border)"></span>
          <div class="layer-icon" style="color:var(--muted);opacity:.6">${getLayerIcon(ch.type)}</div>
          <span class="layer-name" style="color:var(--muted);font-size:10px" data-rename-child="${ch.id}"
            title="Duplo clique para renomear">${getDisplayName(ch)}</span>`;
        ci.querySelector('[data-rename-child]').addEventListener('dblclick', e => {
          e.stopPropagation(); startRename(ch.id, e.currentTarget);
        });
        list.appendChild(ci);
      });
    }
  });

  updateLayerToolbar();
}

function toggleObjVisibility(id) {
  const obj = findById(id); if (!obj) return;
  if (hiddenObjects.has(id)) {
    hiddenObjects.delete(id);
    obj.set({ opacity: obj._savedOpacity !== undefined ? obj._savedOpacity : 1, visible: true });
    delete obj._savedOpacity;
  } else {
    hiddenObjects.add(id);
    obj._savedOpacity = obj.opacity;
    obj.set({ opacity: 0, visible: false });
  }
  canvas.renderAll(); scheduleLayersUpdate();
}

function deleteObjById(id) {
  const obj = findById(id); if (!obj) return;
  pushH(); canvas.remove(obj); canvas.discardActiveObject(); canvas.renderAll();
  socket.emit('object:remove', [id]);
  panelSelected.delete(id); scheduleLayersUpdate();
}

canvas.on('object:added',      scheduleLayersUpdate);
canvas.on('object:removed',    scheduleLayersUpdate);
canvas.on('selection:created', scheduleLayersUpdate);
canvas.on('selection:updated', scheduleLayersUpdate);
canvas.on('selection:cleared', scheduleLayersUpdate);

// SERIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════════════════

// Converte qualquer URL de imagem para path relativo (/uploads/arquivo.jpg).
// O estado compartilhado nunca deve conter localhost ou IP de quem fez upload.
function relativeImgPath(src) {
  if (!src || src.startsWith('blob:')) return '';
  // Já é relativo
  if (src.startsWith('/uploads/')) return src;
  // Absoluto (http://qualquer-host:porta/uploads/arquivo.jpg) → extrai só o path
  try {
    const u = new URL(src);
    if (u.pathname.startsWith('/uploads/')) return u.pathname;
  } catch (_) {}
  // Fallback: se contém /uploads/ em qualquer forma
  const idx = src.indexOf('/uploads/');
  if (idx !== -1) return src.slice(idx);
  return src;
}

// Converte path relativo para URL absoluta usando a origem do cliente atual.
// Chamado APENAS na hora de carregar — nunca no estado salvo.
function absoluteImgUrl(src) {
  if (!src) return '';
  if (src.startsWith('blob:')) return '';
  if (src.startsWith('http://') || src.startsWith('https://')) {
    // Já absoluto mas com host diferente → reescreve com origem atual
    try {
      const u = new URL(src);
      if (u.pathname.startsWith('/uploads/')) {
        return window.location.origin + u.pathname;
      }
    } catch (_) {}
    return src;
  }
  // Relativo → absoluto com origem atual
  return window.location.origin + (src.startsWith('/') ? src : '/' + src);
}

function ser(obj) {
  if (obj._isViewportRect) return null;
  const j = obj.toJSON(['id']);
  if (obj.type === 'image') {
    const el = obj.getElement();
    const raw = el ? el.src : (j.src || '');
    // Salva SEMPRE como path relativo — host-agnóstico
    j.src = relativeImgPath(raw);
  }
  if (j.scaleX < 0) { j.flipX = !j.flipX; j.scaleX = Math.abs(j.scaleX); }
  if (j.scaleY < 0) { j.flipY = !j.flipY; j.scaleY = Math.abs(j.scaleY); }
  j.zIndex = canvas.getObjects().filter(o => !o._isViewportRect).indexOf(obj);
  return j;
}

function serTransform(obj) {
  return {
    id:     obj.id,
    type:   obj.type,
    left:   obj.left,
    top:    obj.top,
    scaleX: Math.abs(obj.scaleX || 1),
    scaleY: Math.abs(obj.scaleY || 1),
    angle:  obj.angle || 0,
    flipX:  obj.flipX || false,
    flipY:  obj.flipY || false,
    opacity: obj.opacity,
    zIndex: canvas.getObjects().filter(o => !o._isViewportRect).indexOf(obj),
  };
}

function serTransformAbsolute(obj, groupMatrix) {
  const localMatrix = obj.calcOwnMatrix();
  const absMatrix   = fabric.util.multiplyTransformMatrices(groupMatrix, localMatrix);
  const d           = fabric.util.qrDecompose(absMatrix);
  const w   = (obj.width  || 0) * Math.abs(d.scaleX);
  const h   = (obj.height || 0) * Math.abs(d.scaleY);
  const rad = d.angle * Math.PI / 180;
  const left = d.translateX - (Math.cos(rad) * w / 2 - Math.sin(rad) * h / 2);
  const top  = d.translateY - (Math.sin(rad) * w / 2 + Math.cos(rad) * h / 2);
  return {
    id:     obj.id, type: obj.type, left, top,
    scaleX: Math.abs(d.scaleX), scaleY: Math.abs(d.scaleY),
    angle:  d.angle, flipX: d.scaleX < 0, flipY: d.scaleY < 0,
    opacity: obj.opacity,
    zIndex: canvas.getObjects().filter(o => !o._isViewportRect).indexOf(obj),
  };
}

// SOCKET
// ═══════════════════════════════════════════════════════════════════════════════
const socket = io({ query: { type: 'editor' }, transports: ['websocket'] });

socket.on('connect', () => {
  document.getElementById('sdot').className = 'sdot on';
  document.getElementById('stxt').textContent = 'Conectado';
});
socket.on('disconnect', () => {
  document.getElementById('sdot').className = 'sdot blink';
  document.getElementById('stxt').textContent = 'Reconectando...';
});
socket.on('board:init', ({ state, userId, userColor }) => {
  myId = userId;
  document.getElementById('mydot').style.background = userColor;
  loadState(state);
  // Restaura tamanho do viewport salvo (posição é sempre 0,0)
  if (state && state.viewport) {
    vpW = state.viewport.w || 1920; vpH = state.viewport.h || 1080;
  }
  createViewportRect();
  fitViewport();
});
socket.on('users:update', users => {
  document.getElementById('ucnt').textContent =
    users.length + ' editor' + (users.length !== 1 ? 'es' : '') + ' online';
});

socket.on('object:add',       d       => applyFull(d));
socket.on('object:modify',    d       => applyFull(d));
socket.on('object:transform', d       => applyTransformOnly(d));
socket.on('objects:transform', updates => { updates.forEach(d => applyTransformOnly(d)); canvas.renderAll(); });
socket.on('object:remove', ids => {
  ids.forEach(id => { const o = findById(id); if (o) canvas.remove(o); });
  canvas.renderAll();
});
socket.on('objects:batch', objs => { objs.forEach(d => applyFull(d, false)); canvas.renderAll(); });
socket.on('board:clear', () => { canvas.clear(); canvas.backgroundColor = '#1e1e2a'; canvas.renderAll(); createViewportRect(); });
socket.on('board:sync', st => { canvas.clear(); canvas.backgroundColor = '#1e1e2a'; loadState(st); setTimeout(createViewportRect, 100); });
socket.on('zorder:sync', order => {
  const contentObjs = canvas.getObjects().filter(o => !o._isViewportRect);
  order.forEach((id, idx) => {
    const o = contentObjs.find(x => x.id === id);
    if (o) canvas.moveTo(o, idx);
  });
  // Mantém viewport no topo
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.renderAll();
  scheduleLayersUpdate();
});

socket.on('viewport:sync', vp => {
  vpW = vp.w; vpH = vp.h;
  drawViewportRect();
});

// Stroke streaming
socket.on('draw:start', ({ userId, x, y, color: c, width: w, opacity: opa }) => {
  if (userId === myId) return;
  const p = new fabric.Path('M ' + x + ' ' + y, {
    stroke: c, strokeWidth: w, fill: null, opacity: opa,
    strokeLineCap: 'round', strokeLineJoin: 'round', selectable: false, evented: false
  });
  remoteStrokes[userId] = { path: p, pts: [{ x, y }] };
  canvas.add(p); canvas.renderAll();
});
socket.on('draw:move', ({ userId, x, y }) => {
  if (userId === myId) return;
  const s = remoteStrokes[userId]; if (!s) return;
  s.pts.push({ x, y });
  s.path.set({ path: fabric.util.parsePath(pts2path(s.pts)) });
  canvas.requestRenderAll();
});
socket.on('draw:end', ({ userId, object }) => {
  if (userId === myId) return;
  const s = remoteStrokes[userId];
  if (s) { canvas.remove(s.path); delete remoteStrokes[userId]; }
  if (object) applyFull(object); else canvas.renderAll();
});

// Cursores remotos
socket.on('cursor:move', ({ userId, color: c, x, y }) => {
  if (userId === myId) return;
  if (!remoteCursors[userId]) {
    const el = document.createElement('div');
    el.className = 'rcursor';
    el.innerHTML = `<svg width="20" height="20" viewBox="0 0 20 20" fill="${c}"><path d="M5 2l12 7.5-6.5.5-3 6.5z"/></svg><span class="rcname" style="background:${c}">${userId}</span>`;
    document.body.appendChild(el);
    remoteCursors[userId] = el;
  }
  remoteCursors[userId].style.left = x + 'px';
  remoteCursors[userId].style.top  = y + 'px';
});
socket.on('cursor:remove', uid => {
  if (remoteCursors[uid]) { remoteCursors[uid].remove(); delete remoteCursors[uid]; }
});

// ═══════════════════════════════════════════════════════════════════════════════
// APLICAÇÃO DE DADOS RECEBIDOS
// ═══════════════════════════════════════════════════════════════════════════════
function applyFull(data, render = true) {
  if (!data) return;
  const ex = findById(data.id);
  if (ex) canvas.remove(ex);
  deser(data, o => {
    canvas.add(o);
    if (data.zIndex !== undefined) {
      const contentObjs = canvas.getObjects().filter(x => !x._isViewportRect);
      const tgt = Math.min(data.zIndex, contentObjs.length - 1);
      canvas.moveTo(o, tgt);
    }
    if (vpRect) canvas.bringToFront(vpRect);
    if (render) canvas.renderAll();
    scheduleLayersUpdate();
  });
}

function applyTransformOnly(data) {
  const obj = findById(data.id); if (!obj) return;
  obj.set({
    left:    data.left,  top:     data.top,
    scaleX:  Math.abs(data.scaleX || 1), scaleY:  Math.abs(data.scaleY || 1),
    angle:   data.angle   || 0,
    flipX:   data.flipX   || false, flipY:   data.flipY   || false,
    opacity: data.opacity !== undefined ? data.opacity : obj.opacity,
  });
  obj.setCoords();
  if ((data.type === 'i-text' || data.type === 'text') && data.text !== undefined) {
    obj.set({ text: data.text, fill: data.fill || obj.fill });
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// EMIT — SYNC
// ═══════════════════════════════════════════════════════════════════════════════
let lastSyncMs = 0;
function throttle60(fn) {
  const now = Date.now();
  if (now - lastSyncMs < 16) return;
  lastSyncMs = now;
  fn();
}

function emitLiveTransform(target) {
  if (!target || target._isViewportRect) return;
  throttle60(() => {
    const isMulti = target.type === 'activeSelection';
    if (!isMulti) {
      if (target.id) socket.volatile.emit('object:transform', serTransform(target));
      return;
    }
    const gm = target.calcTransformMatrix();
    const updates = target.getObjects().filter(o => o.id).map(o => serTransformAbsolute(o, gm));
    if (updates.length) socket.volatile.emit('objects:transform', updates);
  });
}

function emitFull(obj) {
  if (obj._isViewportRect) return;
  if (!obj.id) obj.id = genId();
  const s = ser(obj);
  if (s) socket.emit('object:add', s);
}

function emitModify(obj) {
  if (obj._isViewportRect || !obj.id) return;
  const s = ser(obj);
  if (s) socket.emit('object:modify', s);
}

function emitModifyGroup(target) {
  if (!target) return;
  const isMulti = target.type === 'activeSelection';
  if (!isMulti) { emitModify(target); return; }
  const gm = target.calcTransformMatrix();
  target.getObjects().filter(o => o.id).forEach(o => {
    const abs  = serTransformAbsolute(o, gm);
    const data = ser(o);
    if (!data) return;
    Object.assign(data, abs);
    socket.emit('object:modify', data);
  });
}

function sendBackFront(dir) {
  canvas.getActiveObjects().forEach(o => {
    if (o._isViewportRect) return;
    dir === 'back' ? canvas.sendToBack(o) : canvas.bringToFront(o);
  });
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.renderAll();
  const order = canvas.getObjects().filter(o => o.id && !o._isViewportRect).map(o => o.id);
  socket.emit('zorder:sync', order);
  scheduleLayersUpdate();
}

// ═══════════════════════════════════════════════════════════════════════════════
// EVENTOS DO CANVAS
// ═══════════════════════════════════════════════════════════════════════════════
canvas.on('object:moving',   opt => { if (!opt.target._isViewportRect) emitLiveTransform(opt.target); });
canvas.on('object:scaling',  opt => { if (!opt.target._isViewportRect) emitLiveTransform(opt.target); });
canvas.on('object:rotating', opt => { if (!opt.target._isViewportRect) emitLiveTransform(opt.target); });
canvas.on('object:skewing',  opt => { if (!opt.target._isViewportRect) emitLiveTransform(opt.target); });
canvas.on('object:modified', opt => {
  if (!opt.target || opt.target._isViewportRect) return;
  pushH();
  emitModifyGroup(opt.target);
  scheduleLayersUpdate();
});

canvas.on('path:created', opt => {
  const path = opt.path; path.id = genId();
  if (vpRect) canvas.bringToFront(vpRect);
  pushH(); emitFull(path);
  socket.emit('draw:end', { object: ser(path) });
});

canvas.on('selection:created', updCtx);
canvas.on('selection:updated', updCtx);
canvas.on('selection:cleared', () => { document.getElementById('ctx').style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════════════════════
// POINTER LOGIC
// ═══════════════════════════════════════════════════════════════════════════════
function getCanvasPoint(e) {
  const rect = canvas.upperCanvasEl.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches.length > 0) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  const zoom = canvas.getZoom();
  const vpt  = canvas.viewportTransform;
  return {
    x: (clientX - rect.left - vpt[4]) / zoom,
    y: (clientY - rect.top  - vpt[5]) / zoom,
    clientX, clientY
  };
}

function handlePointerDown(p, target) {
  if (isPanMode || spaceHeld) return;
  if (tool === 'eraser') {
    if (target && target.id && !target._isViewportRect) {
      pushH(); const id = target.id; canvas.remove(target); canvas.renderAll();
      socket.emit('object:remove', [id]);
      scheduleLayersUpdate();
    }
    return;
  }
  if (tool === 'text') { addText(p); return; }
  if (tool === 'pen') {
    penActive = true;
    socket.emit('draw:start', { x: p.x, y: p.y, color, width: sz, opacity: op });
    return;
  }
  if (['rect','circle','line','arrow'].includes(tool)) {
    isDrawing = true;
    drawStart = { x: p.x, y: p.y };
    tmpShapeId = genId();
  }
}

function updateTmpShape(p) {
  if (!isDrawing || !drawStart) return;
  const prev = findById(tmpShapeId);
  if (prev) canvas.remove(prev);
  const sh = mkShape(tool, drawStart, p, tmpShapeId);
  if (!sh) return;
  canvas.add(sh);
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.requestRenderAll();
  throttle60(() => {
    const prev2 = findById(tmpShapeId);
    if (prev2) socket.volatile.emit('object:transform', serTransform(prev2));
  });
}

function handlePointerUp(p) {
  penActive = false;
  if (!isDrawing) return;
  isDrawing = false;
  const prev = findById(tmpShapeId);
  if (prev) canvas.remove(prev);
  const dx = Math.abs(p.x - drawStart.x), dy = Math.abs(p.y - drawStart.y);
  if (dx > 3 || dy > 3) {
    const sh = mkShape(tool, drawStart, p, tmpShapeId);
    if (sh) {
      canvas.add(sh);
      if (vpRect) canvas.bringToFront(vpRect);
      canvas.renderAll();
      pushH();
      emitFull(sh);
    }
  } else {
    socket.emit('object:remove', [tmpShapeId]);
  }
  drawStart = null; tmpShapeId = null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// FERRAMENTAS
// ═══════════════════════════════════════════════════════════════════════════════
function setTool(t) {
  // Sai do pan mode se estava nele
  if (isPanMode && t !== 'pan') exitPanMode();

  tool = t;
  document.querySelectorAll('.tb-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('t-' + t); if (btn) btn.classList.add('active');
  const opts = document.getElementById('opts');
  isDrawing = false; drawStart = null;
  const prev = findById(tmpShapeId);
  if (prev) { canvas.remove(prev); canvas.renderAll(); socket.emit('object:remove', [tmpShapeId]); }
  tmpShapeId = null;

  if (t === 'pan') {
    enterPanMode();
    opts.classList.add('hidden');
    return;
  }
  if (t === 'select') {
    canvas.isDrawingMode = false; canvas.selection = true;
    canvas.defaultCursor = 'default'; opts.classList.add('hidden');
  } else if (t === 'pen') {
    canvas.isDrawingMode = true; canvas.selection = false;
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color = color; canvas.freeDrawingBrush.width = sz;
    opts.classList.remove('hidden');
  } else {
    canvas.isDrawingMode = false; canvas.selection = false;
    canvas.defaultCursor = t === 'eraser' ? 'cell' : 'crosshair';
    opts.classList.remove('hidden');
  }
}

function setColor(c, el) {
  color = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
  if (el) el.classList.add('sel');
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = c;
}
function setSz(v) { sz = parseInt(v); document.getElementById('szv').textContent = v; if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = sz; }
function setOp(v) { op = parseInt(v) / 100; document.getElementById('opv').textContent = v + '%'; if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.opacity = op; }

function updCtx() {
  const o = canvas.getActiveObject();
  if (!o || o._isViewportRect) return;
  document.getElementById('ctx').style.display = 'block';
  document.getElementById('cw').value  = Math.round(o.getScaledWidth());
  document.getElementById('ch').value  = Math.round(o.getScaledHeight());
  document.getElementById('cop').value = Math.round((o.opacity || 1) * 100);
}
function resizeSel(d, v) {
  const o = canvas.getActiveObject(); if (!o || !v || o._isViewportRect) return;
  d === 'w' ? o.scaleToWidth(parseFloat(v)) : o.scaleToHeight(parseFloat(v));
  o.setCoords(); canvas.renderAll(); emitModify(o);
}
function setSelOp(v) {
  const o = canvas.getActiveObject(); if (!o || o._isViewportRect) return;
  o.set({ opacity: parseInt(v) / 100 }); canvas.renderAll(); emitModify(o);
}
function delSel() {
  const ids = canvas.getActiveObjects().filter(o => !o._isViewportRect).map(o => o.id).filter(Boolean);
  canvas.getActiveObjects().filter(o => !o._isViewportRect).forEach(o => canvas.remove(o));
  canvas.discardActiveObject(); canvas.renderAll();
  socket.emit('object:remove', ids);
  scheduleLayersUpdate();
}

// ═══════════════════════════════════════════════════════════════════════════════
// CRIAÇÃO DE FORMAS
// ═══════════════════════════════════════════════════════════════════════════════
function mkShape(t, s, e, id) {
  const oid  = id || genId();
  const base = {
    stroke: color, strokeWidth: sz, fill: 'transparent',
    opacity: op, selectable: true, evented: true,
    strokeLineCap: 'round', strokeLineJoin: 'round', id: oid
  };
  if (t === 'rect')   return new fabric.Rect({ ...base, fill: fillShape ? color : 'transparent', left: Math.min(s.x,e.x), top: Math.min(s.y,e.y), width: Math.abs(e.x-s.x)||1, height: Math.abs(e.y-s.y)||1 });
  if (t === 'circle') return new fabric.Ellipse({ ...base, fill: fillShape ? color : 'transparent', left: Math.min(s.x,e.x), top: Math.min(s.y,e.y), rx: Math.abs(e.x-s.x)/2||1, ry: Math.abs(e.y-s.y)/2||1 });
  if (t === 'line')   return new fabric.Line([s.x, s.y, e.x, e.y], { ...base, fill: null });
  if (t === 'arrow') {
    const ang  = Math.atan2(e.y - s.y, e.x - s.x);
    const hl   = Math.max(14, sz * 3);
    const line = new fabric.Line([s.x, s.y, e.x, e.y], { stroke: color, strokeWidth: sz, fill: null, strokeLineCap: 'round' });
    const head = new fabric.Triangle({ width: hl, height: hl, fill: color, stroke: color, strokeWidth: 1, left: e.x, top: e.y, originX: 'center', originY: 'center', angle: (ang * 180 / Math.PI) + 90 });
    return new fabric.Group([line, head], { id: oid, selectable: true, evented: true, opacity: op });
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// TEXTO
// ═══════════════════════════════════════════════════════════════════════════════
function addText(pos) {
  const t = new fabric.IText('Texto', {
    left: pos.x, top: pos.y, id: genId(),
    fill: color, fontSize: Math.max(16, sz * 4),
    fontFamily: 'Segoe UI, system-ui, sans-serif',
    selectable: true, editable: true
  });
  pushH(); canvas.add(t);
  if (vpRect) canvas.bringToFront(vpRect);
  canvas.setActiveObject(t); t.enterEditing(); canvas.renderAll();
  t.on('editing:exited', () => emitFull(t));
  t.on('changed', () => socket.volatile.emit('object:transform', {
    id: t.id, type: t.type, text: t.text, fill: t.fill,
    left: t.left, top: t.top, scaleX: t.scaleX, scaleY: t.scaleY,
    angle: t.angle, flipX: t.flipX, flipY: t.flipY, opacity: t.opacity
  }));
  setTool('select');
}

// ═══════════════════════════════════════════════════════════════════════════════
// IMAGENS
// ═══════════════════════════════════════════════════════════════════════════════
function showToast(msg) { document.getElementById('toast-msg').textContent = msg; document.getElementById('toast').classList.add('show'); }
function hideToast() { document.getElementById('toast').classList.remove('show'); }

async function uploadFile(file) {
  showToast('Enviando imagem...');
  const fd = new FormData(); fd.append('image', file);
  const res = await fetch('/upload', { method: 'POST', body: fd });
  if (!res.ok) throw new Error('Falha no upload');
  return (await res.json()).url;
}

async function placeImageFromUrl(url) {
  return new Promise(resolve => {
    fabric.Image.fromURL(url, img => {
      const s = img.width > canvas.width * .5 ? canvas.width * .5 / img.width : 1;
      img.scale(s); img.id = genId();
      // Posiciona a imagem no centro do viewport
      const zoom = canvas.getZoom();
      const vpt  = canvas.viewportTransform;
      const cx = (-vpt[4] + window.innerWidth / 2) / zoom;
      const cy = (-vpt[5] + window.innerHeight / 2) / zoom;
      img.set({ left: cx - img.getScaledWidth()/2, top: cy - img.getScaledHeight()/2 });
      resolve(img);
    }, { crossOrigin: 'anonymous' });
  });
}

async function insertImg(inp) {
  const file = inp.files[0]; if (!file) return; inp.value = '';
  try {
    const url = await uploadFile(file);
    const img = await placeImageFromUrl(url);
    pushH(); canvas.add(img);
    if (vpRect) canvas.bringToFront(vpRect);
    canvas.setActiveObject(img); canvas.renderAll(); emitFull(img); hideToast();
  } catch (e) { hideToast(); alert('Erro: ' + e.message); }
}

window.addEventListener('paste', async e => {
  const items = e.clipboardData?.items; if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      try {
        const url = await uploadFile(item.getAsFile());
        const img = await placeImageFromUrl(url);
        pushH(); canvas.add(img);
        if (vpRect) canvas.bringToFront(vpRect);
        canvas.setActiveObject(img); canvas.renderAll(); emitFull(img); hideToast();
      } catch (err) { hideToast(); alert('Erro: ' + err.message); }
      break;
    }
  }
});

// ═══════════════════════════════════════════════════════════════════════════════
// HISTÓRICO
// ═══════════════════════════════════════════════════════════════════════════════
function snap() {
  return canvas.getObjects()
    .filter(o => o.id && !o._isViewportRect)
    .reduce((acc, o) => { const s = ser(o); if (s) acc[o.id] = s; return acc; }, {});
}
function pushH() { undoStack.push(JSON.parse(JSON.stringify(snap()))); if (undoStack.length > MAX_H) undoStack.shift(); redoStack.length = 0; }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); applySnap(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); applySnap(redoStack.pop()); }
function applySnap(map) {
  // Remove objetos de conteúdo, mantém o vpRect
  canvas.getObjects().filter(o => !o._isViewportRect).forEach(o => canvas.remove(o));
  const objs = Object.values(map);
  if (!objs.length) {
    canvas.renderAll();
    if (vpRect) canvas.bringToFront(vpRect);
    socket.emit('board:sync', { objects: {} });
    scheduleLayersUpdate();
    return;
  }
  let done = 0;
  objs.forEach(d => deser(d, o => {
    canvas.add(o);
    if (++done === objs.length) {
      if (vpRect) canvas.bringToFront(vpRect);
      canvas.renderAll();
      socket.emit('board:sync', { objects: map });
      scheduleLayersUpdate();
    }
  }));
}
function clearAll() {
  if (!confirm('Limpar todo o quadro?')) return;
  pushH();
  canvas.getObjects().filter(o => !o._isViewportRect).forEach(o => canvas.remove(o));
  canvas.renderAll();
  socket.emit('board:clear');
  scheduleLayersUpdate();
}

// ═══════════════════════════════════════════════════════════════════════════════
// DESERIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════════════════
function getFabricType(type) {
  const map = {
    'i-text': fabric.IText, 'text': fabric.Text, 'textbox': fabric.Textbox,
    'rect': fabric.Rect, 'circle': fabric.Circle, 'ellipse': fabric.Ellipse,
    'triangle': fabric.Triangle, 'line': fabric.Line,
    'polyline': fabric.Polyline, 'polygon': fabric.Polygon,
  };
  return type in map ? map[type] : fabric[type.charAt(0).toUpperCase() + type.slice(1)];
}

function deser(data, cb) {
  if (!data || !data.type) return;
  if (data.type === 'image') {
    fabric.Image.fromURL(absoluteImgUrl(data.src), img => { img.set(data); img.id = data.id; cb(img); }, { crossOrigin: 'anonymous' });
    return;
  }
  if (data.type === 'path') { const o = new fabric.Path(data.path, data); o.id = data.id; cb(o); return; }
  if (data.type === 'line') {
    const o = new fabric.Line([data.x1, data.y1, data.x2, data.y2], data);
    o.id = data.id; cb(o); return;
  }
  if (data.type === 'group') { fabric.Group.fromObject(data, o => { o.id = data.id; cb(o); }); return; }
  const FT = getFabricType(data.type);
  if (!FT) { console.warn('Tipo desconhecido:', data.type); return; }
  FT.fromObject(data, o => { o.id = data.id; cb(o); });
}

function findById(id) { return canvas.getObjects().find(o => o.id === id); }

function loadState(state) {
  canvas.getObjects().filter(o => !o._isViewportRect).forEach(o => canvas.remove(o));
  if (!state || !state.objects) { canvas.renderAll(); return; }
  const objs = Object.values(state.objects);
  if (!objs.length) { canvas.renderAll(); return; }
  let done = 0;
  objs.forEach(d => deser(d, o => {
    canvas.add(o);
    if (++done === objs.length) {
      if (vpRect) canvas.bringToFront(vpRect);
      canvas.renderAll();
      scheduleLayersUpdate();
    }
  }));
}

function pts2path(pts) { return pts.reduce((a, p, i) => i === 0 ? 'M ' + p.x + ' ' + p.y : a + ' L ' + p.x + ' ' + p.y, ''); }
function genId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

// ═══════════════════════════════════════════════════════════════════════════════
// ATALHOS DE TECLADO
// ═══════════════════════════════════════════════════════════════════════════════
window.addEventListener('keydown', e => {
  const activeObj = canvas.getActiveObject();
  if (activeObj && activeObj.isEditing) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

  // Espaço: pan temporário
  if (e.code === 'Space' && !spaceHeld) {
    e.preventDefault();
    spaceHeld = true;
    prevTool = tool;
    // Se estava na caneta, desativa o modo de desenho para o pan não criar traços
    if (canvas.isDrawingMode) {
      canvas.isDrawingMode = false;
    }
    document.body.classList.add('pan-mode');
    canvas.defaultCursor = 'grab';
    canvas.hoverCursor = 'grab';
    return;
  }

  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    else if (e.key === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 'd') { e.preventDefault(); dupSel(); }
    else if (e.key === 'a') { e.preventDefault(); canvas.setActiveObject(new fabric.ActiveSelection(canvas.getObjects().filter(o => !o._isViewportRect), { canvas })); canvas.renderAll(); }
    return;
  }
  switch (e.key) {
    case 'v': setTool('select'); break; case 'h': setTool('pan'); break;
    case 'p': setTool('pen'); break;
    case 'e': setTool('eraser'); break; case 'r': setTool('rect'); break;
    case 'c': setTool('circle'); break; case 'l': setTool('line'); break;
    case 'a': setTool('arrow'); break;  case 't': setTool('text'); break;
    case 'f': case 'F': fitViewport(); break;
    case '0': resetZoom(); break;
    case '+': case '=': {
      const p = new fabric.Point(window.innerWidth/2, window.innerHeight/2);
      canvas.zoomToPoint(p, Math.min(8, canvas.getZoom() * 1.2));
      canvas.renderAll(); updateZoomInfo(); drawViewportRect();
      break;
    }
    case '-': {
      const p = new fabric.Point(window.innerWidth/2, window.innerHeight/2);
      canvas.zoomToPoint(p, Math.max(0.05, canvas.getZoom() / 1.2));
      canvas.renderAll(); updateZoomInfo(); drawViewportRect();
      break;
    }
    case 'Delete': case 'Backspace': if (canvas.getActiveObjects().length) delSel(); break;
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'Space') {
    spaceHeld = false;
    isPanning = false;
    document.body.classList.remove('pan-mode');
    document.body.classList.remove('panning');
    canvas.defaultCursor = 'default';
    canvas.hoverCursor = 'move';
    // Restaura o modo de desenho se a ferramenta ativa é caneta
    if (tool === 'pen') {
      canvas.isDrawingMode = true;
    }
  }
});

function dupSel() {
  const objs = canvas.getActiveObjects().filter(o => !o._isViewportRect); if (!objs.length) return;
  pushH(); canvas.discardActiveObject();
  const clones = []; let done = 0;
  objs.forEach(o => o.clone(cl => {
    cl.id = genId(); cl.set({ left: o.left + 20, top: o.top + 20 });
    canvas.add(cl); clones.push(cl);
    if (++done === objs.length) {
      if (vpRect) canvas.bringToFront(vpRect);
      canvas.setActiveObject(new fabric.ActiveSelection(clones, { canvas }));
      canvas.renderAll();
      socket.emit('objects:batch', clones.map(ser).filter(Boolean));
      scheduleLayersUpdate();
    }
  }, ['id']));
}

// Init
setTool('select');
</script>
