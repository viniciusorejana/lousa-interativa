<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LiveBoard - Editor</title>
  <style>
    :root { --bg:#0f0f13; --surface:#1a1a24; --surface2:#22222e; --border:#2d2d40; --accent:#7c5cff; --text:#e8e8f0; --muted:#6b6b80; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#1e1e2a; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); user-select:none; }
    #toolbar { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px 10px; box-shadow:0 8px 32px rgba(0,0,0,.5); }
    .tb-sep { width:1px; height:28px; background:var(--border); margin:0 4px; }
    .tb-btn { display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:8px; border:none; background:transparent; color:var(--muted); cursor:pointer; transition:all .15s; position:relative; }
    .tb-btn:hover { background:var(--surface2); color:var(--text); }
    .tb-btn.active { background:rgba(124,92,255,.2); color:var(--accent); }
    .tb-tip { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#111; color:#eee; font-size:11px; padding:4px 8px; border-radius:6px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .15s; z-index:100; }
    .tb-btn:hover .tb-tip { opacity:1; }
    #opts { position:fixed; top:82px; left:50%; transform:translateX(-50%); z-index:999; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 14px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
    #opts.hidden { display:none; }
    .swatch { width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; transition:transform .1s; flex-shrink:0; }
    .swatch:hover { transform:scale(1.15); }
    .swatch.sel { border-color:white; }
    input[type="range"] { width:80px; height:4px; accent-color:var(--accent); cursor:pointer; }
    input[type="color"] { width:28px; height:24px; border:1px solid var(--border); border-radius:6px; cursor:pointer; padding:1px; background:var(--surface2); }
    .ol { font-size:11px; color:var(--muted); white-space:nowrap; }
    #ctx { position:fixed; top:12px; right:12px; z-index:1000; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; width:190px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    #ctx h4 { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.7px; margin-bottom:10px; }
    .cr { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:7px; }
    .cl { font-size:12px; color:var(--muted); }
    .ci { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--text); width:70px; outline:none; }
    .ci:focus { border-color:var(--accent); }
    .cb { width:100%; padding:7px; border-radius:7px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; cursor:pointer; margin-top:4px; }
    .cb:hover { background:var(--border); }
    .cb.d:hover { background:rgba(255,80,80,.15); color:#ff6060; border-color:rgba(255,80,80,.3); }
    #users { position:fixed; bottom:14px; left:14px; z-index:1000; display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px 10px; font-size:12px; }
    .udot { width:8px; height:8px; border-radius:50%; }
    #status { position:fixed; bottom:14px; right:14px; z-index:1000; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .sdot { width:6px; height:6px; border-radius:50%; background:#444; }
    .sdot.on { background:#4ade80; }
    .sdot.blink { background:#fbbf24; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .rcursor { position:fixed; pointer-events:none; z-index:9000; }
    .rcname { position:absolute; left:16px; top:0; font-size:11px; padding:2px 6px; border-radius:4px; white-space:nowrap; color:#000; }
  </style>
</head>
<body>
<div id="toolbar">
  <button class="tb-btn active" id="t-select" onclick="setTool('select')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-tip">Selecionar (V)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="t-pen" onclick="setTool('pen')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg><span class="tb-tip">Caneta (P)</span></button>
  <button class="tb-btn" id="t-eraser" onclick="setTool('eraser')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l10-10 7 7-3.5 3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tb-tip">Borracha (E)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="t-rect" onclick="setTool('rect')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span class="tb-tip">Retângulo (R)</span></button>
  <button class="tb-btn" id="t-circle" onclick="setTool('circle')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span class="tb-tip">Elipse (C)</span></button>
  <button class="tb-btn" id="t-line" onclick="setTool('line')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5" stroke-linecap="round"/></svg><span class="tb-tip">Linha (L)</span></button>
  <button class="tb-btn" id="t-arrow" onclick="setTool('arrow')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg><span class="tb-tip">Seta (A)</span></button>
  <button class="tb-btn" id="t-text" onclick="setTool('text')"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span class="tb-tip">Texto (T)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="document.getElementById('img-inp').click()"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span class="tb-tip">Imagem</span></button>
  <input type="file" id="img-inp" accept="image/*" style="display:none" onchange="insertImg(this)">
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="undo()"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 00-4-4H4"/></svg><span class="tb-tip">Desfazer (Ctrl+Z)</span></button>
  <button class="tb-btn" onclick="redo()"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 014-4h12"/></svg><span class="tb-tip">Refazer (Ctrl+Y)</span></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="clearAll()" style="color:#ff6060"><svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg><span class="tb-tip">Limpar tudo</span></button>
</div>

<div id="opts" class="hidden">
  <span class="ol">Cor:</span>
  <div style="display:flex;gap:5px;align-items:center">
    <div class="swatch sel" style="background:#fff" onclick="setColor('#fff',this)"></div>
    <div class="swatch" style="background:#ff4444" onclick="setColor('#ff4444',this)"></div>
    <div class="swatch" style="background:#ff9900" onclick="setColor('#ff9900',this)"></div>
    <div class="swatch" style="background:#ffdd00" onclick="setColor('#ffdd00',this)"></div>
    <div class="swatch" style="background:#44ff44" onclick="setColor('#44ff44',this)"></div>
    <div class="swatch" style="background:#44aaff" onclick="setColor('#44aaff',this)"></div>
    <div class="swatch" style="background:#cc44ff" onclick="setColor('#cc44ff',this)"></div>
    <div class="swatch" style="background:#000;border-color:#555" onclick="setColor('#000',this)"></div>
    <input type="color" value="#ffffff" onchange="setColor(this.value,null)">
  </div>
  <div class="tb-sep" style="height:24px"></div>
  <span class="ol">Esp:</span><input type="range" id="sz" min="1" max="60" value="4" oninput="setSz(this.value)"><span class="ol" id="szv">4</span>
  <div class="tb-sep" style="height:24px"></div>
  <span class="ol">Opa:</span><input type="range" id="op" min="10" max="100" value="100" oninput="setOp(this.value)"><span class="ol" id="opv">100%</span>
  <div class="tb-sep" style="height:24px"></div>
  <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer"><input type="checkbox" id="fill" onchange="fillShape=this.checked">Preen.</label>
</div>

<div id="ctx">
  <h4>Objeto</h4>
  <div class="cr"><span class="cl">Largura</span><input type="number" class="ci" id="cw" min="1" oninput="resizeSel('w',this.value)"></div>
  <div class="cr"><span class="cl">Altura</span><input type="number" class="ci" id="ch" min="1" oninput="resizeSel('h',this.value)"></div>
  <div class="cr"><span class="cl">Opacidade</span><input type="number" class="ci" id="cop" min="0" max="100" oninput="setSelOp(this.value)"></div>
  <button class="cb" onclick="canvas.getActiveObjects().forEach(o=>canvas.sendToBack(o));canvas.renderAll();syncMod(canvas.getActiveObjects())">Para trás</button>
  <button class="cb" onclick="canvas.getActiveObjects().forEach(o=>canvas.bringToFront(o));canvas.renderAll();syncMod(canvas.getActiveObjects())">Para frente</button>
  <button class="cb d" onclick="delSel()">Excluir</button>
</div>

<div id="users"><div class="udot" id="mydot" style="background:#7c5cff"></div><span id="ucnt">Conectando...</span></div>
<div id="status"><div class="sdot blink" id="sdot"></div><span id="stxt">Conectando...</span></div>
<canvas id="board"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
const canvas = new fabric.Canvas('board', {
  width: window.innerWidth, height: window.innerHeight,
  selection: true,
  renderOnAddRemove: false,
  enableRetinaScaling: true,
  backgroundColor: '#1e1e2a'
});
window.addEventListener('resize', () => {
  canvas.setWidth(window.innerWidth);
  canvas.setHeight(window.innerHeight);
  canvas.renderAll();
});

// ── Estado ────────────────────────────────────────────────────────────────────
let tool = 'select', color = '#ffffff', sz = 4, op = 1, fillShape = false;
let myId = null;
let isDrawing = false, drawStart = null, tmpShape = null;
let penActive = false;

// imageStore: guarda o src original de cada imagem por id, para não reencoder
// a cada modify (evita escala duplicada)
const imageStore = {};

const undoStack = [], redoStack = [], MAX_H = 50;
const remoteStrokes = {}, remoteCursors = {};

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io({ query: { type: 'editor' }, transports: ['websocket'] });

socket.on('connect', () => {
  document.getElementById('sdot').className = 'sdot on';
  document.getElementById('stxt').textContent = 'Conectado';
});
socket.on('disconnect', () => {
  document.getElementById('sdot').className = 'sdot blink';
  document.getElementById('stxt').textContent = 'Reconectando...';
});
socket.on('board:init', ({ state, userId, userColor }) => {
  myId = userId;
  document.getElementById('mydot').style.background = userColor;
  loadState(state);
});
socket.on('users:update', (users) => {
  document.getElementById('ucnt').textContent =
    users.length + ' editor' + (users.length !== 1 ? 'es' : '') + ' online';
});

// Recebe objeto novo de outro cliente
socket.on('object:add', data => {
  // Guarda src original se for imagem
  if (data.type === 'image' && data.src) imageStore[data.id] = data.src;
  addOrUpd(data);
});

// Recebe modificação de outro cliente — reconstrói completamente
socket.on('object:modify', data => {
  // Preserva src original da imagem (o modify não re-envia o src completo)
  if (data.type === 'image') {
    data = { ...data, src: imageStore[data.id] || data.src };
  }
  addOrUpd(data);
});

socket.on('object:remove', ids => {
  ids.forEach(id => {
    delete imageStore[id];
    const o = findById(id); if (o) canvas.remove(o);
  });
  canvas.renderAll();
});

socket.on('objects:batch', objs => {
  objs.forEach(d => {
    if (d.type === 'image' && d.src) imageStore[d.id] = d.src;
    addOrUpd(d, false);
  });
  canvas.renderAll();
});

socket.on('board:clear', () => {
  Object.keys(imageStore).forEach(k => delete imageStore[k]);
  canvas.clear(); canvas.backgroundColor = '#1e1e2a'; canvas.renderAll();
});

socket.on('board:sync', state => {
  Object.keys(imageStore).forEach(k => delete imageStore[k]);
  canvas.clear(); canvas.backgroundColor = '#1e1e2a';
  loadState(state);
});

// Stroke streaming de outros clientes
socket.on('draw:start', ({ userId, x, y, color: c, width: w, opacity: opa }) => {
  if (userId === myId) return;
  const p = new fabric.Path('M ' + x + ' ' + y, {
    stroke: c, strokeWidth: w, fill: null, opacity: opa,
    strokeLineCap: 'round', strokeLineJoin: 'round', selectable: false, evented: false
  });
  remoteStrokes[userId] = { path: p, pts: [{ x, y }] };
  canvas.add(p); canvas.renderAll();
});
socket.on('draw:move', ({ userId, x, y }) => {
  if (userId === myId) return;
  const s = remoteStrokes[userId]; if (!s) return;
  s.pts.push({ x, y });
  s.path.set({ path: fabric.util.parsePath(pts2path(s.pts)) });
  canvas.requestRenderAll();
});
socket.on('draw:end', ({ userId, object }) => {
  if (userId === myId) return;
  const s = remoteStrokes[userId];
  if (s) { canvas.remove(s.path); delete remoteStrokes[userId]; }
  if (object) addOrUpd(object);
  else canvas.renderAll();
});

// Cursores remotos
socket.on('cursor:move', ({ userId, color: c, x, y }) => {
  if (userId === myId) return;
  if (!remoteCursors[userId]) {
    const el = document.createElement('div');
    el.className = 'rcursor';
    el.innerHTML = `<svg width="20" height="20" viewBox="0 0 20 20" fill="${c}"><path d="M5 2l12 7.5-6.5.5-3 6.5z"/></svg><span class="rcname" style="background:${c}">${userId}</span>`;
    document.body.appendChild(el);
    remoteCursors[userId] = el;
  }
  remoteCursors[userId].style.left = x + 'px';
  remoteCursors[userId].style.top = y + 'px';
});
socket.on('cursor:remove', uid => {
  if (remoteCursors[uid]) { remoteCursors[uid].remove(); delete remoteCursors[uid]; }
});

// ── Ferramentas ───────────────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tb-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('t-' + t); if (btn) btn.classList.add('active');
  const opts = document.getElementById('opts');

  isDrawing = false; drawStart = null;
  if (tmpShape) { canvas.remove(tmpShape); canvas.renderAll(); tmpShape = null; }

  if (t === 'select') {
    canvas.isDrawingMode = false;
    canvas.selection = true;
    canvas.defaultCursor = 'default';
    opts.classList.add('hidden');
  } else if (t === 'pen') {
    canvas.isDrawingMode = true;
    canvas.selection = false;
    canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
    canvas.freeDrawingBrush.color = color;
    canvas.freeDrawingBrush.width = sz;
    opts.classList.remove('hidden');
  } else {
    canvas.isDrawingMode = false;
    canvas.selection = false;
    canvas.defaultCursor = t === 'eraser' ? 'cell' : 'crosshair';
    opts.classList.remove('hidden');
  }
}

function setColor(c, el) {
  color = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('sel'));
  if (el) el.classList.add('sel');
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = c;
}
function setSz(v) {
  sz = parseInt(v);
  document.getElementById('szv').textContent = v;
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = sz;
}
function setOp(v) {
  op = parseInt(v) / 100;
  document.getElementById('opv').textContent = v + '%';
  if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.opacity = op;
}

// ── Eventos do canvas ────────────────────────────────────────────────────────
canvas.on('mouse:move', opt => {
  socket.volatile.emit('cursor:move', { x: opt.e.clientX, y: opt.e.clientY });

  if (penActive && tool === 'pen') {
    const p = canvas.getPointer(opt.e);
    socket.volatile.emit('draw:move', { x: p.x, y: p.y });
  }

  if (!isDrawing || !drawStart) return;
  const p = canvas.getPointer(opt.e);
  if (tmpShape) canvas.remove(tmpShape);
  tmpShape = mkShape(tool, drawStart, p);
  if (tmpShape) { canvas.add(tmpShape); canvas.requestRenderAll(); }
});

canvas.on('mouse:down', opt => {
  if (opt.e.button !== 0) return;

  // Se há objetos ativos ou clicou em um objeto → não inicia desenho
  if (canvas.getActiveObjects().length > 0 && tool !== 'eraser') return;
  if (opt.target && tool !== 'eraser' && !['rect','circle','line','arrow','pen','text'].includes(tool)) return;
  // Em modo de forma, se clicou em objeto existente, não desenha por cima
  if (opt.target && ['rect','circle','line','arrow'].includes(tool)) return;

  const p = canvas.getPointer(opt.e);

  if (tool === 'eraser') {
    if (opt.target && opt.target.id) {
      pushH();
      const id = opt.target.id;
      delete imageStore[id];
      canvas.remove(opt.target);
      canvas.renderAll();
      socket.emit('object:remove', [id]);
    }
    return;
  }

  if (tool === 'text') { addText(p); return; }

  if (tool === 'pen') {
    penActive = true;
    socket.emit('draw:start', { x: p.x, y: p.y, color, width: sz, opacity: op });
    return;
  }

  if (['rect', 'circle', 'line', 'arrow'].includes(tool)) {
    isDrawing = true;
    drawStart = { x: p.x, y: p.y };
  }
});

canvas.on('mouse:up', opt => {
  penActive = false;
  if (!isDrawing) return;
  isDrawing = false;

  const p = canvas.getPointer(opt.e);
  if (tmpShape) { canvas.remove(tmpShape); tmpShape = null; }

  const dx = Math.abs(p.x - drawStart.x);
  const dy = Math.abs(p.y - drawStart.y);
  if (dx > 3 || dy > 3) {
    const sh = mkShape(tool, drawStart, p);
    if (sh) { pushH(); canvas.add(sh); canvas.renderAll(); emitAdd(sh); }
  }
  drawStart = null;
});

canvas.on('path:created', opt => {
  const path = opt.path;
  path.id = genId();
  pushH();
  emitAdd(path);
  socket.emit('draw:end', { object: ser(path) });
});

canvas.on('object:modified', opt => {
  if (!opt.target) return;
  pushH();
  const objs = canvas.getActiveObjects().length > 1
    ? canvas.getActiveObjects()
    : [opt.target];
  syncMod(objs);
});

canvas.on('selection:created', updCtx);
canvas.on('selection:updated', updCtx);
canvas.on('selection:cleared', () => { document.getElementById('ctx').style.display = 'none'; });

// ── Painel contextual ─────────────────────────────────────────────────────────
function updCtx() {
  const o = canvas.getActiveObject(); if (!o) return;
  document.getElementById('ctx').style.display = 'block';
  document.getElementById('cw').value = Math.round(o.getScaledWidth());
  document.getElementById('ch').value = Math.round(o.getScaledHeight());
  document.getElementById('cop').value = Math.round((o.opacity || 1) * 100);
}
function resizeSel(d, v) {
  const o = canvas.getActiveObject(); if (!o || !v) return;
  d === 'w' ? o.scaleToWidth(parseFloat(v)) : o.scaleToHeight(parseFloat(v));
  o.setCoords(); canvas.renderAll(); syncMod([o]);
}
function setSelOp(v) {
  const o = canvas.getActiveObject(); if (!o) return;
  o.set({ opacity: parseInt(v) / 100 }); canvas.renderAll(); syncMod([o]);
}
function delSel() {
  const ids = canvas.getActiveObjects().map(o => o.id).filter(Boolean);
  canvas.getActiveObjects().forEach(o => {
    delete imageStore[o.id];
    canvas.remove(o);
  });
  canvas.discardActiveObject();
  canvas.renderAll();
  socket.emit('object:remove', ids);
}

// ── Criação de formas ────────────────────────────────────────────────────────
function mkShape(t, s, e) {
  const base = {
    stroke: color, strokeWidth: sz,
    fill: fillShape ? color : 'transparent',
    opacity: op, selectable: true, evented: true, strokeUniform: true
  };
  const id = genId();
  if (t === 'rect') return new fabric.Rect({ ...base, id, left: Math.min(s.x, e.x), top: Math.min(s.y, e.y), width: Math.abs(e.x - s.x), height: Math.abs(e.y - s.y) });
  if (t === 'circle') return new fabric.Ellipse({ ...base, id, left: Math.min(s.x, e.x), top: Math.min(s.y, e.y), rx: Math.abs(e.x - s.x) / 2, ry: Math.abs(e.y - s.y) / 2 });
  if (t === 'line') return new fabric.Line([s.x, s.y, e.x, e.y], { ...base, id, fill: null });
  if (t === 'arrow') {
    const ang = Math.atan2(e.y - s.y, e.x - s.x), hl = Math.max(12, sz * 3);
    return new fabric.Group([
      new fabric.Line([s.x, s.y, e.x, e.y], { ...base, fill: null }),
      new fabric.Polygon([
        { x: e.x, y: e.y },
        { x: e.x + Math.cos(ang + Math.PI * .8) * hl, y: e.y + Math.sin(ang + Math.PI * .8) * hl },
        { x: e.x + Math.cos(ang - Math.PI * .8) * hl, y: e.y + Math.sin(ang - Math.PI * .8) * hl }
      ], { ...base, fill: color })
    ], { id, selectable: true });
  }
}

// ── Texto ────────────────────────────────────────────────────────────────────
function addText(pos) {
  const t = new fabric.IText('Texto', {
    left: pos.x, top: pos.y, id: genId(),
    fill: color, fontSize: Math.max(16, sz * 4),
    fontFamily: 'Segoe UI, system-ui, sans-serif',
    selectable: true, editable: true
  });
  pushH();
  canvas.add(t);
  canvas.setActiveObject(t);
  t.enterEditing();
  canvas.renderAll();
  // Emite ao sair da edição (texto finalizado)
  t.on('editing:exited', () => {
    emitAdd(t);
  });
  // Emite a cada modificação do texto enquanto edita (sync em tempo real)
  t.on('changed', () => {
    socket.volatile.emit('object:modify', ser(t));
  });
  setTool('select');
}

// ── Imagens ──────────────────────────────────────────────────────────────────
function insertImg(inp) {
  const file = inp.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const srcOriginal = e.target.result;
    fabric.Image.fromURL(srcOriginal, img => {
      const maxW = canvas.width * .5;
      const s = img.width > maxW ? maxW / img.width : 1;
      img.scale(s);
      img.id = genId();
      img.set({
        left: canvas.width / 2 - img.getScaledWidth() / 2,
        top: canvas.height / 2 - img.getScaledHeight() / 2
      });
      // Guarda src original para usar em syncs posteriores
      imageStore[img.id] = srcOriginal;
      pushH();
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
      emitAdd(img);
    });
  };
  reader.readAsDataURL(file);
  inp.value = '';
}

window.addEventListener('paste', e => {
  const items = e.clipboardData?.items; if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => {
        const srcOriginal = ev.target.result;
        fabric.Image.fromURL(srcOriginal, img => {
          const s = img.width > canvas.width * .5 ? canvas.width * .5 / img.width : 1;
          img.scale(s);
          img.id = genId();
          img.set({
            left: canvas.width / 2 - img.getScaledWidth() / 2,
            top: canvas.height / 2 - img.getScaledHeight() / 2
          });
          imageStore[img.id] = srcOriginal;
          pushH();
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
          emitAdd(img);
        });
      };
      reader.readAsDataURL(blob);
      break;
    }
  }
});

// ── Histórico ────────────────────────────────────────────────────────────────
function snap() {
  return canvas.getObjects().reduce((acc, o) => {
    if (o.id) acc[o.id] = ser(o);
    return acc;
  }, {});
}
function pushH() {
  undoStack.push(JSON.parse(JSON.stringify(snap())));
  if (undoStack.length > MAX_H) undoStack.shift();
  redoStack.length = 0;
}
function undo() { if (!undoStack.length) return; redoStack.push(snap()); applySnap(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); applySnap(redoStack.pop()); }
function applySnap(map) {
  canvas.clear(); canvas.backgroundColor = '#1e1e2a';
  const objs = Object.values(map);
  if (!objs.length) { canvas.renderAll(); socket.emit('board:sync', { objects: {} }); return; }
  let done = 0;
  objs.forEach(d => deser(d, o => {
    canvas.add(o);
    if (++done === objs.length) { canvas.renderAll(); socket.emit('board:sync', { objects: map }); }
  }));
}

function clearAll() {
  if (!confirm('Limpar todo o quadro?')) return;
  Object.keys(imageStore).forEach(k => delete imageStore[k]);
  pushH(); canvas.clear(); canvas.backgroundColor = '#1e1e2a'; canvas.renderAll();
  socket.emit('board:clear');
}

// ── Serialização ──────────────────────────────────────────────────────────────
function ser(obj) {
  const j = obj.toJSON(['id']);
  // Para imagens: usa o src ORIGINAL armazenado, nunca toDataURL() com escala
  if (obj.type === 'image') {
    j.src = imageStore[obj.id] || obj.toDataURL({ multiplier: 1 / (obj.scaleX || 1) });
  }
  return j;
}

function emitAdd(obj) {
  if (!obj.id) obj.id = genId();
  const data = ser(obj);
  socket.emit('object:add', data);
}

function syncMod(objs) {
  objs.forEach(o => {
    if (!o.id) return;
    const data = ser(o);
    socket.emit('object:modify', data);
  });
}

// ── Deserialização ────────────────────────────────────────────────────────────
// FIX: mapeia tipos do Fabric corretamente, incluindo 'i-text'
function getFabricType(type) {
  const map = {
    'i-text': fabric.IText,
    'text': fabric.Text,
    'textbox': fabric.Textbox,
    'rect': fabric.Rect,
    'circle': fabric.Circle,
    'ellipse': fabric.Ellipse,
    'triangle': fabric.Triangle,
    'line': fabric.Line,
    'polyline': fabric.Polyline,
    'polygon': fabric.Polygon,
    'path': null, // tratado separadamente
    'group': null, // tratado separadamente
    'image': null, // tratado separadamente
  };
  return type in map ? map[type] : fabric[type.charAt(0).toUpperCase() + type.slice(1)];
}

function deser(data, cb) {
  if (!data || !data.type) return;

  if (data.type === 'image') {
    const src = imageStore[data.id] || data.src || '';
    fabric.Image.fromURL(src, img => {
      // Aplica todas as propriedades do JSON (left, top, scaleX, scaleY, angle, etc.)
      // mas NÃO reaplica scaleX/scaleY na imagem já corretamente dimensionada
      const { src: _src, ...rest } = data;
      img.set(rest);
      img.id = data.id;
      // Garante que o src original fica salvo localmente também
      if (data.src) imageStore[data.id] = data.src;
      cb(img);
    }, { crossOrigin: 'anonymous' });
    return;
  }

  if (data.type === 'path') {
    const o = new fabric.Path(data.path, data);
    o.id = data.id; cb(o);
    return;
  }

  if (data.type === 'group') {
    fabric.Group.fromObject(data, o => { o.id = data.id; cb(o); });
    return;
  }

  const FT = getFabricType(data.type);
  if (!FT) { console.warn('Tipo desconhecido:', data.type); return; }
  FT.fromObject(data, o => { o.id = data.id; cb(o); });
}

function findById(id) { return canvas.getObjects().find(o => o.id === id); }

// Adiciona ou substitui por id, sempre faz renderAll no callback
function addOrUpd(data, render = true) {
  const ex = findById(data.id);
  if (ex) canvas.remove(ex);
  deser(data, o => {
    canvas.add(o);
    if (render) canvas.renderAll();
  });
}

function loadState(state) {
  canvas.clear(); canvas.backgroundColor = '#1e1e2a';
  if (!state || !state.objects) { canvas.renderAll(); return; }
  const objs = Object.values(state.objects);
  if (!objs.length) { canvas.renderAll(); return; }
  // Popula imageStore com srcs que vieram do estado
  objs.forEach(d => { if (d.type === 'image' && d.src) imageStore[d.id] = d.src; });
  let done = 0;
  objs.forEach(d => deser(d, o => {
    canvas.add(o);
    if (++done === objs.length) canvas.renderAll();
  }));
}

function pts2path(pts) {
  return pts.reduce((a, p, i) => i === 0 ? 'M ' + p.x + ' ' + p.y : a + ' L ' + p.x + ' ' + p.y, '');
}
function genId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

// ── Atalhos de teclado ───────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z') { e.preventDefault(); undo(); }
    else if (e.key === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 'd') { e.preventDefault(); dupSel(); }
    else if (e.key === 'a') {
      e.preventDefault();
      canvas.setActiveObject(new fabric.ActiveSelection(canvas.getObjects(), { canvas }));
      canvas.renderAll();
    }
    return;
  }
  switch (e.key) {
    case 'v': setTool('select'); break;
    case 'p': setTool('pen'); break;
    case 'e': setTool('eraser'); break;
    case 'r': setTool('rect'); break;
    case 'c': setTool('circle'); break;
    case 'l': setTool('line'); break;
    case 'a': setTool('arrow'); break;
    case 't': setTool('text'); break;
    case 'Delete':
    case 'Backspace':
      if (canvas.getActiveObjects().length) delSel(); break;
  }
});

function dupSel() {
  const objs = canvas.getActiveObjects(); if (!objs.length) return;
  pushH(); canvas.discardActiveObject();
  const clones = []; let done = 0;
  objs.forEach(o => o.clone(cl => {
    cl.id = genId();
    cl.set({ left: o.left + 20, top: o.top + 20 });
    if (o.type === 'image') imageStore[cl.id] = imageStore[o.id];
    canvas.add(cl); clones.push(cl);
    if (++done === objs.length) {
      canvas.setActiveObject(new fabric.ActiveSelection(clones, { canvas }));
      canvas.renderAll();
      socket.emit('objects:batch', clones.map(ser));
    }
  }, ['id']));
}

setTool('select');
</script>
