<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LiveBoard - OBS View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent !important; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="board"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script>
const canvas = new fabric.Canvas('board', {
  width: window.innerWidth, height: window.innerHeight,
  selection: false, renderOnAddRemove: false,
  enableRetinaScaling: true, backgroundColor: null
});

function makeTransparent() {
  canvas.wrapperEl.style.background = 'transparent';
  canvas.lowerCanvasEl.style.background = 'transparent';
  canvas.upperCanvasEl.style.background = 'transparent';
  document.body.style.background = 'transparent';
}
makeTransparent();

window.addEventListener('resize', () => {
  canvas.setWidth(window.innerWidth);
  canvas.setHeight(window.innerHeight);
  canvas.renderAll();
  makeTransparent();
});

// src original de imagens, igual ao board
const imageStore = {};

// ── Socket ────────────────────────────────────────────────────────────────────
const socket = io({ query: { type: 'view' }, transports: ['websocket'] });

socket.on('board:init', ({ state }) => {
  loadState(state);
});

socket.on('object:add', data => {
  if (data.type === 'image' && data.src) imageStore[data.id] = data.src;
  addOrUpd(data);
});

// modify: reconstrói completamente, igual ao board
socket.on('object:modify', data => {
  if (data.type === 'image') {
    data = { ...data, src: imageStore[data.id] || data.src };
  }
  addOrUpd(data);
});

socket.on('object:remove', ids => {
  ids.forEach(id => {
    delete imageStore[id];
    const o = findById(id); if (o) canvas.remove(o);
  });
  canvas.renderAll();
});

socket.on('objects:batch', objs => {
  objs.forEach(d => {
    if (d.type === 'image' && d.src) imageStore[d.id] = d.src;
    addOrUpd(d, false);
  });
  canvas.renderAll();
});

socket.on('board:clear', () => {
  Object.keys(imageStore).forEach(k => delete imageStore[k]);
  canvas.clear(); makeTransparent(); canvas.renderAll();
});

socket.on('board:sync', state => {
  Object.keys(imageStore).forEach(k => delete imageStore[k]);
  canvas.clear(); makeTransparent();
  loadState(state);
});

// ── Stroke streaming ──────────────────────────────────────────────────────────
const liveStrokes = {};

socket.on('draw:start', ({ userId, x, y, color, width, opacity }) => {
  const p = new fabric.Path('M ' + x + ' ' + y, {
    stroke: color, strokeWidth: width, fill: null, opacity: opacity || 1,
    strokeLineCap: 'round', strokeLineJoin: 'round', selectable: false, evented: false
  });
  liveStrokes[userId] = { path: p, pts: [{ x, y }] };
  canvas.add(p); canvas.renderAll();
});

socket.on('draw:move', ({ userId, x, y }) => {
  const s = liveStrokes[userId]; if (!s) return;
  s.pts.push({ x, y });
  s.path.set({ path: fabric.util.parsePath(pts2path(s.pts)) });
  canvas.requestRenderAll();
});

socket.on('draw:end', ({ userId, object }) => {
  const s = liveStrokes[userId];
  if (s) { canvas.remove(s.path); delete liveStrokes[userId]; }
  if (object) addOrUpd(object);
  else canvas.renderAll();
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function findById(id) {
  return canvas.getObjects().find(o => o.id === id);
}

function addOrUpd(data, render = true) {
  const ex = findById(data.id);
  if (ex) canvas.remove(ex);
  deser(data, o => {
    o.selectable = false;
    o.evented = false;
    canvas.add(o);
    if (render) canvas.renderAll();
  });
}

function loadState(state) {
  canvas.clear(); makeTransparent();
  if (!state || !state.objects) { canvas.renderAll(); return; }
  const objs = Object.values(state.objects);
  if (!objs.length) { canvas.renderAll(); return; }
  objs.forEach(d => { if (d.type === 'image' && d.src) imageStore[d.id] = d.src; });
  let done = 0;
  objs.forEach(d => deser(d, o => {
    o.selectable = false;
    o.evented = false;
    canvas.add(o);
    if (++done === objs.length) canvas.renderAll();
  }));
}

// Mesmo mapeamento de tipos do board.html — crítico para i-text
function getFabricType(type) {
  const map = {
    'i-text':   fabric.IText,
    'text':     fabric.Text,
    'textbox':  fabric.Textbox,
    'rect':     fabric.Rect,
    'circle':   fabric.Circle,
    'ellipse':  fabric.Ellipse,
    'triangle': fabric.Triangle,
    'line':     fabric.Line,
    'polyline': fabric.Polyline,
    'polygon':  fabric.Polygon,
  };
  return type in map ? map[type] : fabric[type.charAt(0).toUpperCase() + type.slice(1)];
}

function deser(data, cb) {
  if (!data || !data.type) return;

  if (data.type === 'image') {
    const src = imageStore[data.id] || data.src || '';
    fabric.Image.fromURL(src, img => {
      const { src: _src, ...rest } = data;
      img.set(rest);
      img.id = data.id;
      if (data.src) imageStore[data.id] = data.src;
      cb(img);
    }, { crossOrigin: 'anonymous' });
    return;
  }

  if (data.type === 'path') {
    const o = new fabric.Path(data.path, data);
    o.id = data.id; cb(o);
    return;
  }

  if (data.type === 'group') {
    fabric.Group.fromObject(data, o => { o.id = data.id; cb(o); });
    return;
  }

  const FT = getFabricType(data.type);
  if (!FT) { console.warn('Tipo desconhecido:', data.type); return; }
  FT.fromObject(data, o => { o.id = data.id; cb(o); });
}

function pts2path(pts) {
  return pts.reduce((a, p, i) => i === 0 ? 'M ' + p.x + ' ' + p.y : a + ' L ' + p.x + ' ' + p.y, '');
}
</script>
</body>
</html>
